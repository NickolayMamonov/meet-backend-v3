name: Backend release recovery audit

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric GitHub draft release ID to audit read-only
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  audit:
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: backend-ghcr-recovery-${{ github.repository }}-${{ inputs.release_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
    steps:
      - name: Checkout reviewed recovery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve and verify the numeric draft read-only
        id: descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          descriptor=$(scripts/resolve-release-descriptor.sh pre-action \
            --repository "$GITHUB_REPOSITORY" \
            --dev-ref origin/dev)
          value() {
            awk -F= -v key="$1" '$1 == key {
              sub(/^[^=]*=/, "")
              print
            }' <<<"$descriptor"
          }
          test "$(value route)" = deep-recover
          test "$(value release_id)" = "$REQUESTED_RELEASE_ID"
          printf '%s\n' "$descriptor" >> "$GITHUB_OUTPUT"
      - name: Set up read-only registry inspection
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Authenticate for read-only inspection
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect read-only recovery evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.descriptor.outputs.release_id }}
          TAG: ${{ steps.descriptor.outputs.tag }}
          VERSION: ${{ steps.descriptor.outputs.version }}
          SOURCE_SHA: ${{ steps.descriptor.outputs.source_sha }}
          ASSET_INVENTORY_FINGERPRINT: ${{ steps.descriptor.outputs.asset_inventory_fingerprint }}
        run: |
          set -euo pipefail
          quarantine="$RUNNER_TEMP/release-quarantine.json"
          set +e
          result=$(scripts/release-registry-state.sh inspect \
            "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$result"
          if [ "$status" -eq 42 ]; then
            test -s "$quarantine"
            jq -e '.registryWrites == 0' "$quarantine" >/dev/null
            jq -c . "$quarantine" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            printf '%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "read-only recovery audit complete; no release mutation was attempted"
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
