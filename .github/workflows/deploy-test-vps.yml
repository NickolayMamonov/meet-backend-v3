name: Deploy backend release to test VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment, explicit guard bootstrap, or exact-image recovery
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - bootstrap-guard
          - forward-recover
      release_tag:
        description: Published immutable backend release tag
        required: true
        default: v1.2.0
        type: string
      run_rollback_drill:
        description: Prove automatic rollback before the final deployment
        required: true
        default: true
        type: boolean
      rollout_domain:
        description: Reviewed rollout contract domain for a normal deployment
        required: false
        default: initial-domain
        type: choice
        options:
          - initial-domain
          - timepad-first-transition
      initial_proof_id:
        description: Reviewed initial-runtime/schema proof selector (never proof contents)
        required: false
        type: string
      bootstrap_id:
        description: One-time authorized guard bootstrap selector
        required: false
        type: string
      recovery_run_key:
        description: Original deployment run key for exact-image recovery
        required: false
        type: string
      recovery_incident:
        description: Persisted incident selector
        required: false
        type: string
      recovery_epoch:
        description: Persisted operation epoch selector
        required: false
        type: string
      recovery_binding_digest:
        description: Frozen evidence binding digest selector
        required: false
        type: string
      recovery_action:
        description: Exact permitted recovery action
        required: false
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    concurrency:
      group: test-vps-deploy-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: test-vps
    env:
      TAG: ${{ inputs.release_tag }}
      RUN_ROLLBACK_DRILL: ${{ inputs.run_rollback_drill }}
      OPERATION: ${{ inputs.operation }}
      ROLLOUT_DOMAIN: ${{ inputs.rollout_domain }}
      INITIAL_PROOF_ID: ${{ inputs.initial_proof_id }}
      BOOTSTRAP_ID: ${{ inputs.bootstrap_id }}
      RECOVERY_RUN_KEY: ${{ inputs.recovery_run_key }}
      RECOVERY_INCIDENT: ${{ inputs.recovery_incident }}
      RECOVERY_EPOCH: ${{ inputs.recovery_epoch }}
      RECOVERY_BINDING_DIGEST: ${{ inputs.recovery_binding_digest }}
      RECOVERY_ACTION: ${{ inputs.recovery_action }}
      HOST: ${{ vars.TEST_VPS_HOST }}
      PORT: ${{ vars.TEST_VPS_PORT }}
      SSH_USER: ${{ vars.TEST_VPS_USER }}
      PATH_ON_HOST: ${{ vars.TEST_VPS_PATH }}
      HOST_FINGERPRINT: ${{ vars.TEST_VPS_SSH_HOST_FINGERPRINT }}
      SSH_PRIVATE_KEY: ${{ secrets.TEST_VPS_SSH_PRIVATE_KEY }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
      PUBLIC_URL: https://api.whysoezzy.online
    steps:
      - name: Protected test-VPS preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$RUN_ROLLBACK_DRILL" in true|false) ;; *) exit 1 ;; esac
          case "$OPERATION" in deploy|bootstrap-guard|forward-recover) ;; *) exit 1 ;; esac
          case "$ROLLOUT_DOMAIN" in initial-domain|timepad-first-transition) ;; *) exit 1 ;; esac
          [[ "$INITIAL_PROOF_ID" =~ ^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$BOOTSTRAP_ID" =~ ^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$RECOVERY_RUN_KEY" =~ ^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$RECOVERY_INCIDENT" =~ ^$|^[A-Fa-f0-9-]{16,64}$ ]]
          [[ "$RECOVERY_EPOCH" =~ ^$|^(0|[1-9][0-9]{0,19})$ ]]
          [[ "$RECOVERY_BINDING_DIGEST" =~ ^$|^[0-9a-f]{64}$ ]]
          case "$RECOVERY_ACTION" in ""|retry-exact-candidate) ;; *) exit 1 ;; esac
          case "$OPERATION" in
            deploy)
              [ -z "$BOOTSTRAP_ID" ] && [ -z "$RECOVERY_RUN_KEY" ] &&
                [ -z "$RECOVERY_INCIDENT" ] && [ -z "$RECOVERY_EPOCH" ] &&
                [ -z "$RECOVERY_BINDING_DIGEST" ] && [ -z "$RECOVERY_ACTION" ] ||
                { echo "invalid mixed operation selectors" >&2; exit 1; }
              if [ "$ROLLOUT_DOMAIN" = timepad-first-transition ]; then
                [ "$RUN_ROLLBACK_DRILL" = false ] && [ -n "$INITIAL_PROOF_ID" ] ||
                  { echo "first transition requires explicit proof and drill=false" >&2; exit 1; }
              else
                [ -z "$INITIAL_PROOF_ID" ] ||
                  { echo "initial proof is only valid for first transition" >&2; exit 1; }
              fi
              ;;
            bootstrap-guard)
              [ "$RUN_ROLLBACK_DRILL" = false ] &&
                [ -n "$BOOTSTRAP_ID" ] && [ -n "$INITIAL_PROOF_ID" ] &&
                [ -z "$RECOVERY_RUN_KEY" ] && [ -z "$RECOVERY_INCIDENT" ] &&
                [ -z "$RECOVERY_EPOCH" ] && [ -z "$RECOVERY_BINDING_DIGEST" ] &&
                [ -z "$RECOVERY_ACTION" ] &&
                [ "$ROLLOUT_DOMAIN" = initial-domain ] ||
                { echo "invalid bootstrap selectors" >&2; exit 1; }
              ;;
            forward-recover)
              [ "$RUN_ROLLBACK_DRILL" = false ] &&
                [ -n "$RECOVERY_RUN_KEY" ] && [ -n "$RECOVERY_INCIDENT" ] &&
                [ -n "$RECOVERY_EPOCH" ] && [ -n "$RECOVERY_BINDING_DIGEST" ] &&
                [ "$RECOVERY_ACTION" = retry-exact-candidate ] &&
                [ -z "$BOOTSTRAP_ID" ] && [ -z "$INITIAL_PROOF_ID" ] &&
                [ "$ROLLOUT_DOMAIN" = initial-domain ] ||
                { echo "invalid recovery selectors" >&2; exit 1; }
              ;;
          esac
          if [ "$OPERATION" != deploy ] &&
            [ "$ROLLOUT_DOMAIN" != initial-domain ]; then
            echo "bootstrap and recovery cannot include deploy selectors" >&2
            exit 1
          fi
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ]
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          [[ "$PATH_ON_HOST" =~ ^/[A-Za-z0-9._/-]+$ ]] &&
            [[ "$PATH_ON_HOST" != *..* ]]
          [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+$ ]]
          grep -Eq '^-----BEGIN (OPENSSH|RSA) PRIVATE KEY-----$' \
            <<<"$SSH_PRIVATE_KEY"
          echo "test_vps_preflight=approved"

      - name: Checkout reviewed deployment tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Buildx for immutable descriptor verification
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Resolve and verify published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir "$release_dir"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            >"$release_dir/release.json"
          release_id=$(jq -r '.id' "$release_dir/release.json")
          source_sha=$(jq -r '.target_commitish' "$release_dir/release.json")
          version=${TAG#v}
          jq -e --arg tag "$TAG" --arg source_sha "$source_sha" '
            type == "object" and
            (.id | type == "number" and floor == . and . > 0) and
            .immutable == true and .draft == false and .prerelease == false and
            .tag_name == $tag and
            .target_commitish == $source_sha and
            ($source_sha | test("^[0-9a-f]{40}$"))
          ' "$release_dir/release.json" >/dev/null

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$release_dir" \
            --pattern release-manifest.json \
            --pattern image-index.json \
            --pattern image-inspect.txt \
            --pattern SHA256SUMS
          scripts/verify-immutable-release-proof.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --release-id "$release_id" \
            --source-sha "$source_sha" \
            --assets-dir "$release_dir" \
            >"$release_dir/immutable-proof.json"

          checksum_args=()
          if [ "$release_id" = 371012814 ]; then
            checksum_args+=(--allow-immutable-v1.2.0-compact)
          fi
          scripts/verify-release-checksums.sh \
            --release-id "$release_id" \
            --assets-dir "$release_dir" \
            "${checksum_args[@]}"

          digest=$(jq -r '.digest' "$release_dir/release-manifest.json")
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg version "$version" \
            --arg source_sha "$source_sha" \
            --argjson release_id "$release_id" \
            --arg digest "$digest" '
              .schema == "meet-backend/release-evidence/v1" and
              .repository == $repository and .image == $image and
              .tag == $tag and .version == $version and
              .releaseId == $release_id and .sourceSha == $source_sha and
              .digest == $digest and
              ($digest | test("^sha256:[0-9a-f]{64}$")) and
              .aliases == [$tag,$version,("sha-"+$source_sha)] and
              .platform == "linux/amd64" and
              .publicationPolicy == "exactly-three-aliases-publish-last" and
              .provenance == true and .sbom == true and
              .artifactAttestation == true and
              .evidence == ["image-index.json","image-inspect.txt"]
            ' "$release_dir/release-manifest.json" >/dev/null

          timeout 30s docker buildx imagetools inspect "$IMAGE@$digest" --raw \
            >"$release_dir/live-image-index.json"
          cmp -s "$release_dir/image-index.json" \
            "$release_dir/live-image-index.json"
          [ "$(grep -Ec "^Digest:[[:space:]]+$digest$" \
            "$release_dir/image-inspect.txt")" -eq 1 ]
          scripts/verify-oci-evidence.sh \
            "$IMAGE" "$digest" "$release_dir/image-index.json" >/dev/null
          gh attestation verify "oci://$IMAGE@$digest" \
            --repo "$GITHUB_REPOSITORY" >/dev/null

          git fetch --no-tags origin dev "$TAG"
          test "$(git rev-list -n 1 "$TAG")" = "$source_sha"
          test "$(git show "$source_sha:version.json" | jq -r '.version')" = "$version"
          git merge-base --is-ancestor "$source_sha" origin/dev
          {
            echo "RELEASE_ID=$release_id"
            echo "SOURCE_SHA=$source_sha"
            echo "VERSION=$version"
            echo "DIGEST=$digest"
            echo "RELEASE_DIR=$release_dir"
          } >>"$GITHUB_ENV"

      - name: Pull and verify exact deployment image
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s docker pull "$IMAGE@$DIGEST" >/dev/null
          test "$(timeout 30s docker image inspect "$IMAGE@$DIGEST" \
            --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(timeout 30s docker image inspect "$IMAGE@$DIGEST" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$SOURCE_SHA"
          test "$(timeout 30s docker image inspect "$IMAGE@$DIGEST" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = \
            "$VERSION"
          test "$(timeout 30s docker image inspect "$IMAGE@$DIGEST" \
            --format '{{.Config.User}}')" = 10001:10001

      - name: Establish strict SSH host trust
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/test-vps-key"
          known_hosts="$RUNNER_TEMP/test-vps-known-hosts"
          ssh_config="$RUNNER_TEMP/test-vps-ssh-config"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" >"$key_file"
          chmod 600 "$key_file"
          timeout 30s ssh-keygen -y -P '' -f "$key_file" >/dev/null
          : >"$known_hosts"
          matched=0
          while IFS= read -r key_line; do
            fingerprint=$(printf '%s\n' "$key_line" |
              timeout 30s ssh-keygen -lf - -E sha256 | timeout 30s awk '{print $2}')
            if [ "$fingerprint" = "$HOST_FINGERPRINT" ]; then
              printf '%s\n' "$key_line" >>"$known_hosts"
              matched=$((matched + 1))
            fi
          done < <(timeout 30s ssh-keyscan -T 5 -p "$PORT" "$HOST" 2>/dev/null)
          [ "$matched" -eq 1 ]
          {
            echo 'Host test-vps'
            echo "  HostName $HOST"
            echo "  Port $PORT"
            echo "  User $SSH_USER"
            echo "  IdentityFile $key_file"
            echo "  UserKnownHostsFile $known_hosts"
            echo '  BatchMode yes'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  ConnectTimeout 10'
            echo '  ConnectionAttempts 1'
            echo '  ServerAliveInterval 5'
            echo '  ServerAliveCountMax 2'
            echo '  TCPKeepAlive yes'
          } >"$ssh_config"
          chmod 600 "$ssh_config"
          echo "SSH_CONFIG=$ssh_config" >>"$GITHUB_ENV"

      - name: Stage checksum-bound deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/test-vps-tooling"
          archive="$RUNNER_TEMP/test-vps-tooling.tar"
          remote="$PATH_ON_HOST/.test-vps-tooling-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$stage/scripts"
          contract_check=$(python3 -B scripts/test_vps_timepad_state.py \
            check-contract --contract scripts/test-vps-timepad-release-contracts.json)
          jq -e '.outcome == "valid" and (.active | type == "boolean")' \
            <<<"$contract_check" >/dev/null
          files=(
            docker-compose.production.yml
            scripts/production-compose.sh
            scripts/production-config-digest.sh
            scripts/test-vps-runtime-invariants.sh
            scripts/test-vps-public-probe.sh
            scripts/update-production-release.sh
            scripts/deploy-test-vps-release.sh
            scripts/deploy-test-vps-provider-release.sh
            scripts/test-vps-provider-credential.py
            scripts/test_vps_timepad_state.py
            scripts/test_vps_timepad_supervisor.py
            scripts/test-vps-timepad-release-contracts.json
          )
          for file in "${files[@]}"; do
            mkdir -p "$stage/$(dirname "$file")"
            cp -- "$file" "$stage/$file"
          done
          chmod 755 "$stage"/scripts/*.sh "$stage"/scripts/*.py
          (
            cd "$stage"
            sha256sum "${files[@]}" >SHA256SUMS
          )
          tar -C "$stage" -cf "$archive" "${files[@]}" SHA256SUMS
          timeout 60s ssh -F "$SSH_CONFIG" test-vps bash -s -- "$PATH_ON_HOST" "$remote" <<'REMOTE'
          set -euo pipefail
          root=$1
          stage=$2
          [ -d "$root" ] && [ -s "$root/.env.production" ]
          command -v python3 >/dev/null 2>&1
          python3 --version >/dev/null 2>&1
          [ ! -e "$stage" ]
          install -d -m 700 "$stage"
          REMOTE
          timeout 60s scp -F "$SSH_CONFIG" "$archive" "test-vps:$remote/tooling.tar"
          timeout 120s ssh -F "$SSH_CONFIG" test-vps bash -s -- "$remote" <<'REMOTE'
          set -euo pipefail
          stage=$1
          tar -xf "$stage/tooling.tar" -C "$stage"
          (
            cd "$stage"
            sha256sum -c SHA256SUMS
          )
          chmod 755 "$stage"/scripts/*.sh
          REMOTE
          echo "REMOTE_TOOLING=$remote" >>"$GITHUB_ENV"

      - name: Pull and verify exact image on test VPS
        shell: bash
        run: |
          set -euo pipefail
          target_id=$(timeout 300s ssh -F "$SSH_CONFIG" test-vps bash -s -- \
            "$IMAGE@$DIGEST" "$SOURCE_SHA" "$VERSION" <<'REMOTE'
          set -euo pipefail
          image=$1
          revision=$2
          version=$3
          timeout 240s docker pull "$image" >/dev/null
          test "$(timeout 30s docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$revision"
          test "$(timeout 30s docker image inspect "$image" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = \
            "$version"
          test "$(timeout 30s docker image inspect "$image" --format '{{.Config.User}}')" = \
            10001:10001
          timeout 30s docker image inspect "$image" --format '{{.Id}}'
          REMOTE
          )
          [[ "$target_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TARGET_IMAGE_ID=$target_id" >>"$GITHUB_ENV"

      - name: Exercise automatic image rollback
        if: inputs.operation == 'deploy' && inputs.run_rollback_drill
        shell: bash
        run: |
          set -euo pipefail
          previous_id=$(timeout 60s ssh -F "$SSH_CONFIG" test-vps bash -s <<'REMOTE'
          set -euo pipefail
          mapfile -t containers < <(timeout 30s docker ps -q \
            --filter label=com.docker.compose.project=meet-production \
            --filter label=com.docker.compose.service=backend)
          [ "${#containers[@]}" -eq 1 ]
          timeout 30s docker inspect "${containers[0]}" --format '{{.Image}}'
          REMOTE
          )
          [[ "$previous_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$previous_id" != "$TARGET_IMAGE_ID" ]

          set +e
          output=$(timeout 900s ssh -F "$SSH_CONFIG" test-vps \
            "$REMOTE_TOOLING/scripts/deploy-test-vps-provider-release.sh" \
            --root "$PATH_ON_HOST" \
            --base-compose "$REMOTE_TOOLING/docker-compose.production.yml" \
            --image "$IMAGE@$DIGEST" \
            --revision "$SOURCE_SHA" \
            --version "$VERSION" \
            --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --public-url "$PUBLIC_URL" \
            --mode rollback-drill \
            --operation deploy \
            --rollout-domain "$ROLLOUT_DOMAIN" \
            --initial-proof-id "$INITIAL_PROOF_ID" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          printf '%s\n' "$output"
          [ "$status" -eq 86 ]
          grep -Fq "candidate=ready image_id=$TARGET_IMAGE_ID" <<<"$output"
          grep -Fq 'rollback_drill=triggered' <<<"$output"
          grep -Fq "rollback=completed previous_image_id=$previous_id" <<<"$output"
          validate_provider_json() {
            local json=$1
            local expected_outcome=$2
            jq -e --arg expected_outcome "$expected_outcome" '
              type == "object" and
              (keys | sort) == [
                "credentialMountPresent",
                "credentialMountReadOnly",
                "outcome",
                "providerEnabled",
                "schemaVersion"
              ] and
              .schemaVersion == 1 and
              (.providerEnabled | type == "boolean") and
              (.credentialMountPresent | type == "boolean") and
              (.credentialMountReadOnly | type == "boolean") and
              (
                (
                  .providerEnabled == true and
                  .credentialMountPresent == true and
                  .credentialMountReadOnly == true
                ) or
                (
                  .providerEnabled == false and
                  .credentialMountPresent == false and
                  .credentialMountReadOnly == false
                )
              ) and
              .outcome == $expected_outcome
            ' <<<"$json" >/dev/null
          }
          [ "$(grep -Ec '^\{"schemaVersion":1,' <<<"$output")" -eq 1 ]
          provider_json=$(grep -E '^\{"schemaVersion":1,' <<<"$output" | tail -n 1)
          validate_provider_json "$provider_json" rolled-back

          restored_id=$(timeout 60s ssh -F "$SSH_CONFIG" test-vps bash -s <<'REMOTE'
          set -euo pipefail
          mapfile -t containers < <(timeout 30s docker ps -q \
            --filter label=com.docker.compose.project=meet-production \
            --filter label=com.docker.compose.service=backend)
          [ "${#containers[@]}" -eq 1 ]
          timeout 30s docker inspect "${containers[0]}" --format '{{.Image}}'
          REMOTE
          )
          [ "$restored_id" = "$previous_id" ]
          {
            echo "ROLLBACK_PREVIOUS_IMAGE_ID=$previous_id"
            echo "ROLLBACK_RESTORED_IMAGE_ID=$restored_id"
          } >>"$GITHUB_ENV"

      - name: Deploy selected release successfully
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 900s ssh -F "$SSH_CONFIG" test-vps \
            "$REMOTE_TOOLING/scripts/deploy-test-vps-provider-release.sh" \
            --root "$PATH_ON_HOST" \
            --base-compose "$REMOTE_TOOLING/docker-compose.production.yml" \
            --image "$IMAGE@$DIGEST" \
            --revision "$SOURCE_SHA" \
            --version "$VERSION" \
            --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --public-url "$PUBLIC_URL" \
            --mode deploy \
            --operation deploy \
            --rollout-domain "$ROLLOUT_DOMAIN" \
            --initial-proof-id "$INITIAL_PROOF_ID" |
            tee "$RUNNER_TEMP/deploy-output.txt"; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          grep -Fq "deployment=completed image_id=$TARGET_IMAGE_ID" \
            "$RUNNER_TEMP/deploy-output.txt"
          validate_provider_json() {
            local json=$1
            local expected_outcome=$2
            jq -e --arg expected_outcome "$expected_outcome" '
              type == "object" and
              (keys | sort) == [
                "credentialMountPresent",
                "credentialMountReadOnly",
                "outcome",
                "providerEnabled",
                "schemaVersion"
              ] and
              .schemaVersion == 1 and
              (.providerEnabled | type == "boolean") and
              (.credentialMountPresent | type == "boolean") and
              (.credentialMountReadOnly | type == "boolean") and
              (
                (
                  .providerEnabled == true and
                  .credentialMountPresent == true and
                  .credentialMountReadOnly == true
                ) or
                (
                  .providerEnabled == false and
                  .credentialMountPresent == false and
                  .credentialMountReadOnly == false
                )
              ) and
              .outcome == $expected_outcome
            ' <<<"$json" >/dev/null
          }
          [ "$(grep -Ec '^\{"schemaVersion":1,' \
            "$RUNNER_TEMP/deploy-output.txt")" -eq 1 ]
          provider_json=$(grep -E '^\{"schemaVersion":1,' \
            "$RUNNER_TEMP/deploy-output.txt" | tail -n 1)
          validate_provider_json "$provider_json" committed
          provider_enabled=$(jq -er '.providerEnabled' <<<"$provider_json")
          credential_mount_present=$(jq -er '.credentialMountPresent' <<<"$provider_json")
          credential_mount_read_only=$(jq -er '.credentialMountReadOnly' <<<"$provider_json")
          mapfile -t schema_guard_outcomes < <(
            grep -E '^schema_guard=(legacy-no-transition|pre-barrier-only|post-barrier-compatible|cutover-possible|rolled-back|committed)$' \
              "$RUNNER_TEMP/deploy-output.txt" |
              sed 's/^schema_guard=//'
          )
          [ "${#schema_guard_outcomes[@]}" -ge 1 ] || {
            echo "RECOVERY_REQUIRED: missing schema guard outcome" >&2
            exit 1
          }
          schema_guard=${schema_guard_outcomes[${#schema_guard_outcomes[@]}-1]}
          case "$ROLLOUT_DOMAIN:$schema_guard" in
            initial-domain:legacy-no-transition|timepad-first-transition:committed) ;;
            *)
              echo "RECOVERY_REQUIRED: schema guard outcome does not match the selected rollout" >&2
              exit 1
              ;;
          esac
          {
            echo "PROVIDER_ENABLED=$provider_enabled"
            echo "CREDENTIAL_MOUNT_PRESENT=$credential_mount_present"
            echo "CREDENTIAL_MOUNT_READ_ONLY=$credential_mount_read_only"
            echo "SCHEMA_GUARD_OUTCOME=$schema_guard"
          } >>"$GITHUB_ENV"

      - name: Bootstrap guard or recover exact candidate
        if: inputs.operation == 'bootstrap-guard' || inputs.operation == 'forward-recover'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --root "$PATH_ON_HOST"
            --base-compose "$REMOTE_TOOLING/docker-compose.production.yml"
            --image "$IMAGE@$DIGEST"
            --revision "$SOURCE_SHA"
            --version "$VERSION"
            --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            --public-url "$PUBLIC_URL"
            --mode deploy
            --operation "$OPERATION"
          )
          if [ "$OPERATION" = bootstrap-guard ]; then
            args+=(--initial-proof-id "$INITIAL_PROOF_ID" --bootstrap-id "$BOOTSTRAP_ID")
          else
            args+=(
              --recovery-run-key "$RECOVERY_RUN_KEY"
              --recovery-incident "$RECOVERY_INCIDENT"
              --recovery-epoch "$RECOVERY_EPOCH"
              --recovery-binding-digest "$RECOVERY_BINDING_DIGEST"
              --recovery-action "$RECOVERY_ACTION"
            )
          fi
          output=$(timeout 900s ssh -F "$SSH_CONFIG" test-vps \
            "$REMOTE_TOOLING/scripts/deploy-test-vps-provider-release.sh" \
            "${args[@]}" 2>&1) || {
            status=$?
            printf '%s\n' "$output"
            if [ "$OPERATION" = forward-recover ] &&
              [ "$(grep -Fc 'test VPS deployment failed: RECOVERY_RECONCILIATION_UNAVAILABLE' <<<"$output" || true)" -eq 1 ]; then
              echo "RECOVERY_REQUIRED: exact-image reconciliation is unavailable" >&2
            else
              echo "RECOVERY_REQUIRED" >&2
            fi
            exit "$status"
          }
          printf '%s\n' "$output"
          [ "$OPERATION" = bootstrap-guard ] || {
            echo "RECOVERY_REQUIRED: recovery returned without reconciliation" >&2
            exit 1
          }
          [ "$(grep -Ec '^schema_guard=ready$' <<<"$output" || true)" -eq 1 ] &&
            [ "$(grep -Ec '^operation_outcome=(bootstrapped|already-initialized)$' <<<"$output" || true)" -eq 1 ] ||
            { echo "GUARD_BOOTSTRAP_OUTCOME_INVALID" >&2; exit 1; }
          operation_outcome=$(grep -E '^operation_outcome=(bootstrapped|already-initialized)$' \
            <<<"$output" | sed 's/^operation_outcome=//')
          {
            echo "## Test VPS schema guard"
            echo
            echo "- Guard bootstrap: \`$operation_outcome\` (epoch 0)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Capture runtime and public HTTPS evidence
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(timeout 180s ssh -F "$SSH_CONFIG" test-vps bash -s -- \
            "$TARGET_IMAGE_ID" "$SOURCE_SHA" "$VERSION" <<'REMOTE'
          set -euo pipefail
          expected_id=$1
          revision=$2
          version=$3
          mapfile -t backends < <(timeout 30s docker ps -q \
            --filter label=com.docker.compose.project=meet-production \
            --filter label=com.docker.compose.service=backend)
          mapfile -t postgres < <(timeout 30s docker ps -q \
            --filter label=com.docker.compose.project=meet-production \
            --filter label=com.docker.compose.service=postgres)
          [ "${#backends[@]}" -eq 1 ] && [ "${#postgres[@]}" -eq 1 ]
          backend=${backends[0]}
          database=${postgres[0]}
          image_id=$(timeout 30s docker inspect "$backend" --format '{{.Image}}')
          [ "$image_id" = "$expected_id" ]
          [ "$(timeout 30s docker image inspect "$image_id" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "$revision" ]
          [ "$(timeout 30s docker image inspect "$image_id" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = \
            "$version" ]
          uid=$(timeout 30s docker exec "$backend" id -u)
          gid=$(timeout 30s docker exec "$backend" id -g)
          [ "$uid:$gid" = 10001:10001 ]
          health=$(timeout 30s docker inspect "$backend" --format '{{.State.Health.Status}}')
          [ "$health" = healthy ]
          binding=$(timeout 30s docker inspect "$backend" --format \
            '{{range $port, $bindings := .NetworkSettings.Ports}}{{if eq $port "8080/tcp"}}{{range $bindings}}{{.HostIp}}:{{.HostPort}}{{println}}{{end}}{{end}}{{end}}')
          [ "$(wc -l <<<"$binding")" -eq 1 ]
          [[ "$binding" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          [ -z "$(timeout 30s docker port "$database")" ]
          upload=$(timeout 30s docker inspect "$backend" --format \
            '{{range .Mounts}}{{if eq .Destination "/data/uploads"}}{{.Name}}{{end}}{{end}}')
          [ "$upload" = meet-production_uploads_data ]
          timeout 30s docker volume inspect meet-production_uploads_data >/dev/null
          timeout 30s docker volume inspect meet-production_postgres_data >/dev/null
          jq -cn \
            --arg imageId "$image_id" \
            --arg revision "$revision" \
            --arg version "$version" \
            --arg uid "$uid" --arg gid "$gid" \
            --arg health "$health" --arg binding "$binding" \
            --arg upload "$upload" \
            '{
              imageId:$imageId,revision:$revision,version:$version,
              runtimeUser:($uid+":"+$gid),health:$health,
              backendBinding:$binding,postgresPublished:false,
              uploadVolume:$upload,
              postgresVolume:"meet-production_postgres_data"
            }'
          REMOTE
          )
          jq -e \
            --arg image_id "$TARGET_IMAGE_ID" \
            --arg revision "$SOURCE_SHA" \
            --arg version "$VERSION" '
              .imageId == $image_id and .revision == $revision and
              .version == $version and .runtimeUser == "10001:10001" and
              .health == "healthy" and
              (.backendBinding | test("^127\\.0\\.0\\.1:[0-9]+$")) and
              .postgresPublished == false and
              .uploadVolume == "meet-production_uploads_data" and
              .postgresVolume == "meet-production_postgres_data"
            ' <<<"$runtime" >/dev/null

          probe_output=$(timeout 45s \
            "$GITHUB_WORKSPACE/scripts/test-vps-public-probe.sh" \
            "$PUBLIC_URL")
          grep -Fxq 'meetings_status=200' <<<"$probe_output"
          grep -Fxq 'meetings_array=true' <<<"$probe_output"
          grep -Fxq 'actuator_status=404' <<<"$probe_output"
          redirect_status=$(sed -n 's/^redirect_status=//p' <<<"$probe_output")
          case "$redirect_status" in 301|302|307|308) ;; *) exit 1 ;; esac
          meetings_status=200
          actuator_status=404

          {
            echo "## Test VPS deployment evidence"
            echo
            echo "- Release: \`$TAG\` (ID \`$RELEASE_ID\`)"
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- OCI digest: \`$DIGEST\`"
            if [ "$RUN_ROLLBACK_DRILL" = true ]; then
              echo "- Automatic rollback: restored \`$ROLLBACK_RESTORED_IMAGE_ID\`"
            else
              echo "- Automatic rollback drill: skipped by explicit input"
            fi
            echo "- Final image ID: \`$TARGET_IMAGE_ID\`"
            echo "- Runtime: healthy, user \`10001:10001\`, backend loopback-only"
            echo "- Volumes: PostgreSQL and uploads preserved"
            echo "- Provider: enabled=$PROVIDER_ENABLED, credential mount present=$CREDENTIAL_MOUNT_PRESENT, read-only=$CREDENTIAL_MOUNT_READ_ONLY"
            echo "- Schema guard: \`$SCHEMA_GUARD_OUTCOME\`"
            echo "- Public probes: meetings=$meetings_status, actuator=$actuator_status, HTTP redirect=$redirect_status"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Apply bounded test-VPS deployment retention
        if: inputs.operation != 'bootstrap-guard'
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 300s ssh -F "$SSH_CONFIG" test-vps bash -s -- \
            "$PATH_ON_HOST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$REMOTE_TOOLING" <<'REMOTE'
          set -euo pipefail
          root=$1
          run_id=$2
          run_attempt=$3
          tooling=$4
          tooling_prefix="$root/.test-vps-tooling-"
          state_root=/var/lib/meet-test-vps-deploy
          [[ "$run_id" =~ ^[0-9]+$ ]] && [[ "$run_attempt" =~ ^[0-9]+$ ]]
          [ -d "$root" ] && [ -d "$state_root" ]
          if timeout 1s sh -c 'sleep 2' >/dev/null 2>&1; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          else
            timeout_status=$?
            [ "$timeout_status" -eq 124 ] || {
              echo "RECOVERY_REQUIRED" >&2
              exit 1
            }
          fi
          exec 9<"$state_root/.deploy.lock"
          flock -n 9
          execution_lease="$state_root/.timepad-execution.json"
          if [ -e "$execution_lease" ] || [ -L "$execution_lease" ]; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          guard_helper="$tooling/scripts/test_vps_timepad_state.py"
          protected_refs=()
          protected_states=()
          guard_directory="$state_root/timepad-guard"
          if [ -L "$guard_directory" ]; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          if [ -e "$guard_directory" ] || [ -L "$guard_directory" ]; then
            [ -d "$guard_directory" ] && [ ! -L "$guard_directory" ] &&
              [ -f "$guard_helper" ] && [ ! -L "$guard_helper" ] || {
              echo "RECOVERY_REQUIRED" >&2
              exit 1
            }
            if ! guard_state_json=$(timeout 30s python3 "$guard_helper" read-state \
              --root "$state_root" --deploy-lock-fd 9); then
              echo "RECOVERY_REQUIRED" >&2
              exit 1
            fi
            if ! guard_owned_run=$(jq -er '
              if type == "object" and .outcome == "read" and
                (.originDigest | type == "string" and test("^[a-f0-9]{64}$")) and
                (.current | type == "object") and
                .current.controller == "timepad-cutover-v1" and
                (.current.operationEpoch | type == "number" and floor == . and . >= 0) and
                (.current.phase | type == "string" and
                  test("^(READY|PREPARED|CUTOVER_POSSIBLE|VERIFYING|COMMITTING|COMMITTED|ROLLING_BACK|ROLLED_BACK|RECOVERY_REQUIRED|FORWARD_RECOVERING)$")) and
                (.current.ownedRun == null or
                  (.current.ownedRun | type == "string" and
                    test("^[A-Za-z0-9][A-Za-z0-9._-]{0,127}-(rollback-drill|final-deploy)$")))
              then .current.ownedRun // empty
              else error("invalid guard state")
              end
            ' <<<"$guard_state_json"); then
              echo "RECOVERY_REQUIRED" >&2
              exit 1
            fi
            if [ -n "$guard_owned_run" ]; then
              guard_run_path="$state_root/$guard_owned_run"
              [ -d "$guard_run_path" ] && [ ! -L "$guard_run_path" ] || {
                echo "RECOVERY_REQUIRED" >&2
                exit 1
              }
              protected_states+=("$guard_run_path")
            fi
          fi
          smtp_pointer="$state_root/.smtp-transaction.current"
          if [ -e "$smtp_pointer" ] || [ -L "$smtp_pointer" ]; then
            echo "retention=skipped smtp_transaction_present"
            exit 1
          fi
          retention_unresolved=false
          add_protected_ref() {
            local ref=$1
            [[ "$ref" =~ ^/[A-Za-z0-9._/-]+$ ]] && [[ "$ref" != *..* ]] ||
              return 1
            if [ -L "$ref" ] || { [ -e "$ref" ] && [ "$(realpath -- "$ref")" != "$ref" ]; }; then
              return 1
            fi
            protected_refs+=("$ref")
          }
          compose_refs() {
            local rendered
            rendered=$(timeout 30s env -i PATH="$PATH" HOME=/root COMPOSE_PROJECT_NAME=meet-production \
              docker compose --project-directory "$root" \
              --env-file "$root/.env.production" "$@" config --format json 2>/dev/null) ||
              return 1
            refs=$(jq -r '
              .. | objects |
              select(.type? == "bind" and (.source? | type == "string")) |
              .source
            ' <<<"$rendered") || return 1
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              add_protected_ref "$ref" || return 1
            done <<<"$refs"
          }
          running_containers=$(timeout 30s docker ps -q \
            --filter label=com.docker.compose.project=meet-production 2>/dev/null) ||
            retention_unresolved=true
          [ -n "$running_containers" ] || retention_unresolved=true
          if [ "$retention_unresolved" = false ]; then
            while IFS= read -r container; do
              [ -n "$container" ] || continue
              mount_json=$(timeout 30s docker inspect "$container" \
                --format '{{json .Mounts}}' 2>/dev/null) ||
                { retention_unresolved=true; break; }
              mount_refs=$(jq -r '
                if type == "array" then
                  .[] | select(.Type == "bind") | .Source
                else
                  error("invalid mounts")
                end
              ' <<<"$mount_json") || { retention_unresolved=true; break; }
              while IFS= read -r ref; do
                [ -n "$ref" ] || continue
                add_protected_ref "$ref" || retention_unresolved=true
              done <<<"$mount_refs"
              [ "$retention_unresolved" = false ] || break
            done <<<"$running_containers"
          fi
          if [ -s /var/lib/meet-production/active-compose.yml ] &&
            [ -s /var/lib/meet-production/active-runtime.override.yml ]; then
            compose_refs \
              -f /var/lib/meet-production/active-compose.yml \
              -f /var/lib/meet-production/active-runtime.override.yml ||
              retention_unresolved=true
          else
            retention_unresolved=true
          fi

          delete_tree() {
            local path=$1
            [ -d "$path" ] && [ ! -L "$path" ]
            ! find "$path" -xdev -type l -print -quit | grep -q .
            find "$path" -xdev -type f -delete
            find "$path" -xdev -depth -type d -empty -delete
            [ ! -e "$path" ]
          }

          delete_owned_state() {
            local path=$1
            local -a delete_args=(retention-delete --state-root "$state_root"
              --retention-state "$path" --deploy-lock-fd 9)
            local ref protected
            for ref in "${protected_refs[@]}"; do
              delete_args+=(--protected-path "$ref")
            done
            for protected in "${protected_states[@]}"; do
              delete_args+=(--protected-state "$protected")
            done
            timeout 30s python3 "$tooling/scripts/test-vps-provider-credential.py" \
              "${delete_args[@]}" >/dev/null
          }

          mapfile -t state_paths < <(
            find "$state_root" -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' |
              while IFS=' ' read -r timestamp path; do
                name=${path#"$state_root/"}
                [[ "$name" =~ ^[0-9]+-[0-9]+-(rollback-drill|final-deploy)$ ]] ||
                  continue
                printf '%s %s\n' "$timestamp" "$path"
              done |
              sort -nr |
              cut -d' ' -f2-
          )
          provider_args=(retention-list --state-root "$state_root")
          provider_args+=(--deploy-lock-fd 9)
          for ref in "${protected_refs[@]}"; do
            provider_args+=(--protected-path "$ref")
          done
          for path in "${protected_states[@]}"; do
            provider_args+=(--protected-state "$path")
          done
          if ! owned_json=$(timeout 30s python3 \
            "$tooling/scripts/test-vps-provider-credential.py" \
            "${provider_args[@]}"); then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          if ! owned_state_names_json=$(jq -e -c '
            if type == "object" and .schemaVersion == 1 and
              .outcome == "retention-safe" and
              (.ownedStates | type == "array") and
              all(.ownedStates[];
                type == "string" and
                test("^[0-9]+-[0-9]+-(rollback-drill|final-deploy)$")
              ) and
              ((.ownedStates | unique | length) == (.ownedStates | length))
            then .ownedStates
            else error("invalid retention admission")
            end
          ' <<<"$owned_json"); then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          if ! owned_state_names_text=$(jq -r '.[]' <<<"$owned_state_names_json"); then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
          owned_state_names=()
          while IFS= read -r name; do
            [ -n "$name" ] && owned_state_names+=("$name")
          done <<<"$owned_state_names_text"
          states=()
          for path in "${state_paths[@]}"; do
            name=${path#"$state_root/"}
            if find "$path" -xdev -type l -print -quit | grep -q .; then
              protected_states+=("$path")
              continue
            fi
            if [ -s "$path/previous-active-compose.yml" ]; then
              compose_args=(-f "$path/previous-active-compose.yml")
              [ -s "$path/previous-active-runtime.yml" ] &&
                compose_args+=(-f "$path/previous-active-runtime.yml")
              compose_refs "${compose_args[@]}" || {
                protected_states+=("$path")
                continue
              }
            fi
            if [ -s "$path/target-runtime.override.yml" ]; then
              compose_refs \
                -f "$root/docker-compose.production.yml" \
                -f "$path/target-runtime.override.yml" || {
                  protected_states+=("$path")
                  continue
                }
            fi
            for owned_name in "${owned_state_names[@]}"; do
              if [ "$name" = "$owned_name" ]; then
                states+=("$path")
                break
              fi
            done
          done
          provider_args=(retention-list --state-root "$state_root")
          provider_args+=(--deploy-lock-fd 9)
          for ref in "${protected_refs[@]}"; do
            provider_args+=(--protected-path "$ref")
          done
          for path in "${protected_states[@]}"; do
            provider_args+=(--protected-state "$path")
          done
          timeout 30s python3 "$tooling/scripts/test-vps-provider-credential.py" \
            "${provider_args[@]}" >/dev/null || {
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          }
          if [ "$retention_unresolved" != false ]; then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi

          states_removed=0
          for ((index=10; index<${#states[@]}; index++)); do
            path=${states[$index]}
            protected=false
            for protected_path in "${protected_states[@]}"; do
              [ "$path" = "$protected_path" ] && protected=true
            done
            if [ "$protected" = false ]; then
              for ref in "${protected_refs[@]}"; do
                case "$ref" in
                  "$path"|"$path"/*) protected=true; break ;;
                esac
              done
            fi
            [ "$protected" = false ] || continue
            delete_owned_state "$path" || {
              echo "RECOVERY_REQUIRED" >&2
              exit 1
            }
            [ ! -e "$path" ] && states_removed=$((states_removed + 1))
          done

          tooling_removed=0
          for path in "$tooling_prefix"*; do
            [ -e "$path" ] || continue
            name=${path#"$tooling_prefix"}
            [[ "$name" =~ ^[0-9]+-[0-9]+$ ]]
            delete_tree "$path"
            tooling_removed=$((tooling_removed + 1))
          done

          [ -s /var/lib/meet-production/active-compose.yml ]
          [ -s /var/lib/meet-production/active-runtime.override.yml ]
          kept=$((${#states[@]} - states_removed))
          echo "retention=applied tooling_removed=$tooling_removed states_removed=$states_removed states_kept=$kept"
          REMOTE
          then
            echo "RECOVERY_REQUIRED" >&2
            exit 1
          fi
