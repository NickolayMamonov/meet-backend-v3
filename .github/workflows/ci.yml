name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  gradle:
    name: Gradle tests and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Run non-PostgreSQL tests
        run: ./gradlew test -PskipPostgresTests
      - name: Build and verify
        run: ./gradlew clean build -PskipPostgresTests
      - name: Verify version authority
        run: |
          set -euo pipefail
          version=$(jq -r '.version' version.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          ./gradlew properties -q | grep -Fx "version: $version"
          unzip -p build/libs/*-plain.jar META-INF/build-info.properties 2>/dev/null |
            grep -Fx "build.version=$version"

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Run PostgreSQL suite
        run: ./gradlew postgresTest

  scripts:
    name: Compose, Bash, and ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          shellcheck --severity=warning scripts/*.sh
      - name: Validate production Compose
        env:
          DB_NAME: meet
          DB_USERNAME: meet
          DB_PASSWORD: local-only-validation-value
          APP_JWT_SECRET: local-only-validation-value
          APP_STORAGE_BASE_URL: http://localhost:8080
          BACKEND_IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BACKEND_REVISION: 0123456789abcdef0123456789abcdef01234567
        run: docker compose -f docker-compose.production.yml config --quiet

  docker:
    name: Docker image verification
    runs-on: ubuntu-24.04
    needs: [gradle]
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build image
        run: |
          set -euo pipefail
          version=$(jq -r '.version' version.json)
          revision=$(git rev-parse HEAD)
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag meet-backend:ci \
            --build-arg "BACKEND_VERSION=$version" \
            --build-arg "BACKEND_REVISION=$revision" \
            .
          test "$(docker image inspect meet-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect meet-backend:ci --format '{{index .Config.Labels \"org.opencontainers.image.version\"}}')" = "$version"
          test "$(docker image inspect meet-backend:ci --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')" = "$revision"
          docker image inspect meet-backend:ci --format '{{json .Config.Labels}}' | jq -e 'has("org.opencontainers.image.source")'
          docker run --rm --entrypoint sh meet-backend:ci -ec \
            'test -f /app/app.jar && test -d /data/uploads && test -w /data/uploads'
