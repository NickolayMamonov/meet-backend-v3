name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      source_sha:
        description: Exact release source commit; requires the complete release tuple
        required: false
        type: string
      release_tag:
        description: Release tag associated with source_sha
        required: false
        type: string
      release_version:
        description: Canonical release SemVer associated with source_sha
        required: false
        type: string
      release_id:
        description: Numeric GitHub release ID associated with source_sha
        required: false
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  validate-call:
    name: Validate reusable call
    runs-on: ubuntu-24.04
    steps:
      - name: Require a complete release tuple
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          populated=0
          for value in "$SOURCE_SHA" "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_ID"; do
            [ -z "$value" ] || populated=$((populated + 1))
          done
          if [ "$populated" -eq 0 ]; then
            exit 0
          fi
          [ "$populated" -eq 4 ] || {
            echo "source_sha, release_tag, release_version, and release_id must be supplied together" >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]

  retention-proof-toolchain:
    name: Verify pinned retention tools package when prepared
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE: ghcr.io/nickolaymamonov/retention-proof-tools
      PACKAGE_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Validate image lock and provenance identity
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          lock=scripts/fixtures/retention-proof/toolchain.lock.json
          dockerfile=scripts/fixtures/retention-proof/Dockerfile
          provenance=scripts/fixtures/retention-proof/provenance.json
          bundle=scripts/fixtures/retention-proof/provenance.bundle.json
          package_lock_json=$(jq -cS '.packages' "$lock")
          package_lock_sha256=$(printf '%s' "$package_lock_json" | sha256sum | cut -d' ' -f1)
          dockerfile_sha256=$(sha256sum "$dockerfile" | cut -d' ' -f1)
          test "$(jq -r '.enabled' "$lock")" = false
          test "$(jq -r '.dockerfileSha256' "$lock")" = "$dockerfile_sha256"
          test "$(jq -r '.packages | length' "$lock")" = 115
          image_digest=$(jq -r '.preparedImage' "$lock")
          provenance_sha256=$(jq -r '.provenanceSha256' "$lock")

          if [ -z "$image_digest" ] && [ -z "$provenance_sha256" ] &&
             [ ! -e "$provenance" ] && [ ! -e "$bundle" ]; then
            echo "toolchain package publication is deferred; protected proof remains disabled"
            echo "prepared=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$provenance_sha256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$provenance" && test ! -L "$provenance"
          test -f "$bundle" && test ! -L "$bundle"
          test "$(wc -c <"$bundle")" -le 65536
          test "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$provenance_sha256"
          jq -e \
            --arg image "$IMAGE" \
            --arg image_digest "$image_digest" \
            --arg bundle_sha256 "$provenance_sha256" '
              type == "object" and
              (keys == ["bundleSha256","image","imageDigest","runId","schemaVersion","sourceSha","workflow"]) and
              .schemaVersion == 1 and
              .image == $image and
              .imageDigest == $image_digest and
              .bundleSha256 == $bundle_sha256 and
              (.sourceSha | type == "string" and test("^[0-9a-f]{40}$")) and
              (.workflow | type == "string" and test("^\\.github/workflows/[A-Za-z0-9_.-]+\\.yml$")) and
              (.runId | type == "string" and test("^[1-9][0-9]*$"))
            ' "$provenance" >/dev/null
          source_sha=$(jq -r '.sourceSha' "$provenance")
          signer_workflow=$(jq -r '.workflow' "$provenance")
          printf 'prepared=true\n' >>"$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$image_digest" >>"$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"
          printf 'signer_workflow=%s\n' "$signer_workflow" >>"$GITHUB_OUTPUT"
          printf 'package_lock_sha256=%s\n' "$package_lock_sha256" >>"$GITHUB_OUTPUT"
          printf 'provenance_sha256=%s\n' "$provenance_sha256" >>"$GITHUB_OUTPUT"

      - name: Authenticate to private GHCR package
        if: steps.lock.outputs.prepared == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            timeout 30s docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Pull and verify exact tools-only image
        if: steps.lock.outputs.prepared == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.lock.outputs.image_digest }}
          SOURCE_SHA: ${{ steps.lock.outputs.source_sha }}
          SIGNER_WORKFLOW: ${{ steps.lock.outputs.signer_workflow }}
          PACKAGE_LOCK_SHA256: ${{ steps.lock.outputs.package_lock_sha256 }}
          PROVENANCE_SHA256: ${{ steps.lock.outputs.provenance_sha256 }}
        run: |
          set -euo pipefail
          test "$(timeout 30s gh api "users/$PACKAGE_OWNER/packages/container/retention-proof-tools" --jq '.visibility')" = private
          timeout 240s docker pull "$IMAGE@$IMAGE_DIGEST" >/dev/null
          test "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test -z "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
          test "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.base.name"}}')" = ubuntu:24.04@sha256:f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b
          test "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{index .Config.Labels "com.meet.retention-proof.snapshot"}}')" = 20260918T000000Z
          test "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{index .Config.Labels "com.meet.retention-proof.packages-sha256"}}')" = "$PACKAGE_LOCK_SHA256"
          test "$(timeout 30s docker image inspect "$IMAGE@$IMAGE_DIGEST" --format '{{index .Config.Labels "com.meet.retention-proof.dockerfile-sha256"}}')" = "$(sha256sum scripts/fixtures/retention-proof/Dockerfile | cut -d' ' -f1)"
          timeout 60s gh attestation verify "oci://$IMAGE@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-digest "$SOURCE_SHA" \
            --bundle scripts/fixtures/retention-proof/provenance.bundle.json >/dev/null
          test "$(sha256sum scripts/fixtures/retention-proof/provenance.bundle.json | cut -d' ' -f1)" = "$PROVENANCE_SHA256"

  gradle:
    name: Gradle tests and build
    runs-on: ubuntu-24.04
    needs: validate-call
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_ID: ${{ inputs.release_id }}
      TOOLING_SCRIPTS: ${{ inputs.source_sha != '' && '../tooling/scripts' || 'scripts' }}
    steps:
      - name: Checkout reviewed source
        if: inputs.source_sha == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout reviewed CI tooling
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - name: Checkout exact release source
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Record reviewed source identity
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPLICIT_REF: ${{ inputs.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          echo "reviewed source SHA: $actual_sha"
          if [ -n "$SOURCE_SHA" ]; then
            test "$actual_sha" = "$SOURCE_SHA"
          elif [ -n "$EXPLICIT_REF" ]; then
            echo "reviewed source ref: $EXPLICIT_REF"
          else
            expected_sha="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
            test "$actual_sha" = "$expected_sha"
          fi
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: ${{ inputs.source_sha != '' && 'source/**/*.gradle*' || '**/*.gradle*' }}
      - name: Run non-PostgreSQL tests
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        run: ./gradlew test -PskipPostgresTests
      - name: Build and verify
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        run: ./gradlew clean build -PskipPostgresTests
      - name: Verify version authority
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' version.json)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          revision=$(git rev-parse HEAD)
          if [ -n "$SOURCE_SHA" ]; then
            test "$revision" = "$SOURCE_SHA"
            test "$version" = "$RELEASE_VERSION"
            test "$RELEASE_TAG" = "v$RELEASE_VERSION"
            "$TOOLING_SCRIPTS/verify-release-consistency.sh" \
              "$RELEASE_VERSION" "$SOURCE_SHA" --tag "$RELEASE_TAG"
          else
            "$TOOLING_SCRIPTS/verify-release-consistency.sh" "$version" "$revision"
          fi

  postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-24.04
    needs: validate-call
    steps:
      - name: Checkout reviewed source
        if: inputs.source_sha == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout reviewed CI tooling
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - name: Checkout exact release source
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Record reviewed source identity
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPLICIT_REF: ${{ inputs.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          echo "reviewed source SHA: $actual_sha"
          if [ -n "$SOURCE_SHA" ]; then
            test "$actual_sha" = "$SOURCE_SHA"
          elif [ -n "$EXPLICIT_REF" ]; then
            echo "reviewed source ref: $EXPLICIT_REF"
          else
            expected_sha="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
            test "$actual_sha" = "$expected_sha"
          fi
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: ${{ inputs.source_sha != '' && 'source/**/*.gradle*' || '**/*.gradle*' }}
      - name: Run PostgreSQL suite
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        run: ./gradlew postgresTest

  scripts:
    name: Compose, Bash, and ShellCheck
    runs-on: ubuntu-24.04
    needs: validate-call
    env:
      TOOLING_SCRIPTS: ${{ inputs.source_sha != '' && '../tooling/scripts' || 'scripts' }}
    steps:
      - name: Checkout reviewed source
        if: inputs.source_sha == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Checkout reviewed CI tooling
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - name: Checkout exact release source
        if: inputs.source_sha != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Record reviewed source identity
        working-directory: ${{ inputs.source_sha != '' && 'source' || '.' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPLICIT_REF: ${{ inputs.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          echo "reviewed source SHA: $actual_sha"
          if [ -n "$SOURCE_SHA" ]; then
            test "$actual_sha" = "$SOURCE_SHA"
          elif [ -n "$EXPLICIT_REF" ]; then
            echo "reviewed source ref: $EXPLICIT_REF"
          else
            expected_sha="${PR_HEAD_SHA:-$WORKFLOW_SHA}"
            test "$actual_sha" = "$expected_sha"
          fi
      - name: Read-only Docker Engine info and server API inspection
        working-directory: ${{ inputs.source_sha != '' && 'tooling' || '.' }}
        run: |
          set -euo pipefail
          timeout 65s python3 -B - <<'PY'
          import importlib.util
          import re
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "retention_proof_supervisor",
              Path("scripts/retention-proof-supervisor.py"),
          )
          if spec is None or spec.loader is None:
              raise SystemExit("retention supervisor module is unavailable")
          supervisor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(supervisor)
          engine = supervisor.DockerEngine()
          metadata = engine.info()
          if (
              not isinstance(metadata.get("DockerRootDir"), str)
              or not metadata["DockerRootDir"].startswith("/")
              or not isinstance(metadata.get("ServerVersion"), str)
              or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", metadata["ServerVersion"])
              or not isinstance(metadata.get("ApiVersion"), str)
              or not re.fullmatch(r"[0-9]+\.[0-9]+", metadata["ApiVersion"])
          ):
              raise SystemExit("Docker Engine info/version metadata is incomplete")
          print(
              "read-only Docker Engine metadata validated: "
              f"server={metadata['ServerVersion']} api={metadata['ApiVersion']}"
          )
          PY
      - name: Verify hosted Docker Engine generated mount layout
        working-directory: ${{ inputs.source_sha != '' && 'tooling' || '.' }}
        run: |
          set -euo pipefail
          timeout 150s python3 -B - <<'PY'
          import importlib.util
          import json
          import re
          import subprocess
          import uuid
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "retention_proof_supervisor",
              Path("scripts/retention-proof-supervisor.py"),
          )
          if spec is None or spec.loader is None:
              raise SystemExit("retention supervisor module is unavailable")
          supervisor = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(supervisor)

          engine = supervisor.DockerEngine()
          engine_info = engine.info()
          expected_lock = {
              "engineVersion": "28.0.4",
              "engineApiVersion": "1.48",
              "engineLayout": "moby-v28-root-container-id-v1",
          }
          docker_root = supervisor.validate_engine_info(engine_info, expected_lock)
          image = (
              "ubuntu:24.04@sha256:"
              "f610ab94648195aa356059f5b41d6085c9d4d903c072430cdd1af7bdb646106b"
          )
          owner = uuid.uuid4().hex
          name = "meet-retention-engine-layout-" + owner
          container_id = ""
          create_attempted = False
          environment = engine._environment()

          def docker(arguments, *, timeout=30, maximum=1024 * 1024):
              try:
                  result = subprocess.run(
                      ["docker", *arguments],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      timeout=timeout,
                      env=environment,
                      check=False,
                  )
              except (OSError, subprocess.SubprocessError) as error:
                  raise RuntimeError("bounded Docker Engine probe failed") from error
              if len(result.stdout) > maximum or len(result.stderr) > 4096:
                  raise RuntimeError("Docker Engine probe response exceeded its bound")
              if result.returncode != 0:
                  detail = result.stderr.decode("utf-8", errors="replace").strip()
                  raise RuntimeError(
                      f"Docker {arguments[0]} failed with exit {result.returncode}: {detail}"
                  )
              return result.stdout

          def inspect(identifier):
              response = json.loads(
                  docker(["inspect", "--type", "container", identifier])
              )
              if not isinstance(response, list) or len(response) != 1:
                  raise RuntimeError("named container inspection is malformed")
              return response[0]

          def owned_container_id():
              identifiers = docker(
                  [
                      "ps",
                      "--all",
                      "--quiet",
                      "--no-trunc",
                      "--filter",
                      "name=" + name,
                  ],
                  maximum=4096,
              ).decode("ascii", errors="strict").splitlines()
              if not identifiers:
                  return ""
              if len(identifiers) != 1 or not re.fullmatch(r"[0-9a-f]{64}", identifiers[0]):
                  raise RuntimeError("named container teardown inventory is ambiguous")
              inspection = inspect(identifiers[0])
              if not isinstance(inspection, dict):
                  raise RuntimeError("named container teardown inspection is malformed")
              config = inspection.get("Config") if isinstance(inspection, dict) else None
              labels = config.get("Labels") if isinstance(config, dict) else None
              if (
                  inspection.get("Id") != identifiers[0]
                  or inspection.get("Name") != "/" + name
                  or not isinstance(labels, dict)
                  or labels.get("com.meet.retention-proof.owner") != owner
                  or (container_id and container_id != identifiers[0])
              ):
                  raise RuntimeError("named container teardown ownership differs")
              return identifiers[0]

          stage = "base-image pull"
          try:
              docker(["pull", "--platform", "linux/amd64", image], timeout=30)
              stage = "owned container creation"
              create_attempted = True
              created = docker(
                  [
                      "create",
                      "--name",
                      name,
                      "--label",
                      "com.meet.retention-proof.owner=" + owner,
                      "--network",
                      "none",
                      "--log-driver",
                      "none",
                      "--read-only",
                      "--user",
                      "0:0",
                      "--cap-drop",
                      "ALL",
                      "--cap-add",
                      "CHOWN",
                      "--security-opt",
                      "no-new-privileges:true",
                      "--security-opt",
                      "seccomp=builtin",
                      "--pids-limit",
                      "256",
                      "--cpus",
                      "2",
                      "--memory",
                      "1g",
                      "--tmpfs",
                      "/fixture:rw,noexec,nosuid,nodev,size=268435456,mode=0700",
                      "--tmpfs",
                      "/tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777",
                      "--entrypoint",
                      "/bin/bash",
                      image,
                      "-euo",
                      "pipefail",
                      "-c",
                      "exec sleep 120",
                  ],
                  maximum=4096,
              ).decode("ascii").strip()
              if not re.fullmatch(r"[0-9a-f]{64}", created):
                  raise RuntimeError("Docker Engine returned an invalid container ID")
              container_id = created

              stage = "pre-start isolation inspection"
              before = inspect(container_id)
              config = before.get("Config")
              host = before.get("HostConfig")
              if (
                  before.get("Id") != container_id
                  or not isinstance(config, dict)
                  or config.get("Image") != image
                  or config.get("Volumes") not in (None, {})
                  or not isinstance(host, dict)
                  or host.get("NetworkMode") != "none"
                  or host.get("ReadonlyRootfs") is not True
                  or host.get("Binds") not in (None, [])
                  or host.get("Mounts") not in (None, [])
                  or host.get("VolumesFrom") not in (None, [])
                  or set(host.get("Tmpfs", {})) != {"/fixture", "/tmp"}
              ):
                  raise RuntimeError("pre-start container isolation differs")

              stage = "container start and post-start inspection"
              docker(["start", container_id])
              after = inspect(container_id)
              state = after.get("State")
              config = after.get("Config")
              host = after.get("HostConfig")
              if (
                  after.get("Id") != container_id
                  or not isinstance(state, dict)
                  or state.get("Running") is not True
                  or not isinstance(config, dict)
                  or config.get("Image") != image
                  or not isinstance(host, dict)
                  or host.get("NetworkMode") != "none"
                  or host.get("ReadonlyRootfs") is not True
              ):
                  raise RuntimeError("post-start container isolation differs")

              engine_identity = {
                  "schemaVersion": 1,
                  "containerId": container_id,
                  "owner": owner,
                  "dockerRootDir": docker_root,
                  "engineVersion": engine_info["ServerVersion"],
                  "engineApiVersion": engine_info["ApiVersion"],
              }
              metadata_request = json.dumps(
                  engine_identity, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              supervisor.validate_metadata_request(metadata_request)

              def live_identity():
                  live_info = engine.info()
                  live_root = supervisor.validate_engine_info(live_info, expected_lock)
                  live = inspect(container_id)
                  config = live.get("Config")
                  labels = config.get("Labels") if isinstance(config, dict) else None
                  state = live.get("State")
                  if (
                      live_root != docker_root
                      or live_info.get("ServerVersion") != engine_identity["engineVersion"]
                      or live_info.get("ApiVersion") != engine_identity["engineApiVersion"]
                      or live.get("Id") != container_id
                      or live.get("Name") != "/" + name
                      or not isinstance(labels, dict)
                      or labels.get("com.meet.retention-proof.owner") != owner
                      or not isinstance(state, dict)
                      or state.get("Running") is not True
                      or any(
                          live.get(field)
                          != f"{docker_root}/containers/{container_id}/{leaf}"
                          for field, leaf in (
                              ("HostnamePath", "hostname"),
                              ("HostsPath", "hosts"),
                              ("ResolvConfPath", "resolv.conf"),
                          )
                      )
                  ):
                      raise RuntimeError("live Engine/container identity changed")
                  return (
                      live_root,
                      live_info["ServerVersion"],
                      live_info["ApiVersion"],
                      live.get("Id"),
                      labels.get("com.meet.retention-proof.owner"),
                      tuple(live.get(key) for key in ("HostnamePath", "HostsPath", "ResolvConfPath")),
                      config,
                      live.get("HostConfig"),
                      live.get("Mounts"),
                      state.get("Running"),
                  ), live

              before_identity, _ = live_identity()
              metadata = engine.collect_host_metadata(metadata_request)
              after_identity, after = live_identity()
              if before_identity != after_identity:
                  raise RuntimeError("Engine/container identity changed during host metadata collection")

              stage = "container mount evidence"
              mountinfo = docker(
                  ["exec", container_id, "/bin/bash", "-euo", "pipefail", "-c", "cat /proc/self/mountinfo"]
              )
              stat_output = docker(
                  [
                      "exec",
                      container_id,
                      "/bin/bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      "for path in /etc/hostname /etc/hosts /etc/resolv.conf; do test -f \"$path\" && test ! -L \"$path\" || exit 1; stat -c '%n|%u|%F' \"$path\"; done",
                  ],
                  maximum=4096,
              ).decode("utf-8", errors="strict")
              stat_rows = stat_output.splitlines()
              targets = ("/etc/hostname", "/etc/hosts", "/etc/resolv.conf")
              if len(stat_rows) != len(targets):
                  raise RuntimeError("container Engine mount file evidence is incomplete")
              inner_mounts = supervisor.parse_mountinfo(mountinfo)
              evidence = {}
              for target, row in zip(targets, stat_rows, strict=True):
                  fields = row.split("|")
                  matches = [mount for mount in inner_mounts if mount["mountpoint"] == target]
                  if len(fields) != 3 or fields[0] != target or len(matches) != 1:
                      raise RuntimeError("container Engine mount evidence is ambiguous")
                  mount = matches[0]
                  options = set(mount["options"].split(","))
                  if (
                      not re.fullmatch(r"[0-9]+", fields[1])
                      or fields[2] != "regular file"
                      or "ro" not in options
                      or "rw" in options
                  ):
                      raise RuntimeError("container Engine mount is not a read-only regular file")
                  evidence[target] = {
                      "root": mount["root"],
                      "device": mount["device"],
                      "readOnly": True,
                      "regular": True,
                      "uid": int(fields[1]),
                  }
              supervisor.validate_engine_file_evidence(
                  after,
                  engine_root=docker_root,
                  container_id=container_id,
                  owner=owner,
                  engine_version=engine_identity["engineVersion"],
                  engine_api_version=engine_identity["engineApiVersion"],
                  host_metadata=metadata,
                  host_mountinfo_bytes=engine.host_mountinfo(),
                  container_evidence=evidence,
              )
              print(
                  "hosted Docker Engine generated mount layout validated: "
                  "server=28.0.4 api=1.48 layout=moby-v28-root-container-id-v1"
              )
          except Exception as error:
              raise SystemExit(
                  f"hosted Docker Engine mount-layout probe denied during {stage}: "
                  f"{type(error).__name__}: {error}"
              ) from error
          finally:
              if create_attempted:
                  stage = "owned container teardown"
                  owned_id = owned_container_id()
                  if owned_id:
                      docker(["rm", "--force", owned_id], timeout=30, maximum=4096)
                      if owned_container_id():
                          raise SystemExit("hosted Docker Engine probe teardown was not verified")
          PY
