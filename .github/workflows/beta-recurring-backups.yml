name: Closed-beta recurring backups

on:
  schedule:
    - cron: "17 1,13 * * *"
    - cron: "47 3 * * 1"
  workflow_dispatch:
    inputs:
      drill:
        description: Run the protected weekly drill
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: closed-beta-recurring-${{ github.event.schedule || inputs.drill || 'capture' }}
  cancel-in-progress: false

env:
  SCHEDULER_REF: refs/heads/master

jobs:
  admission:
    runs-on: ubuntu-24.04
    if: vars.BETA_RECURRING_ACTIVATED == 'true'
    outputs:
      checkout_sha: ${{ steps.authorize.outputs.checkout_sha }}
      environment: ${{ steps.authorize.outputs.environment }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 1
      - name: Validate registered custody and CI provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_REF: ${{ github.ref }}
          SCHEDULER_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ (github.event.schedule == '47 3 * * 1' || inputs.drill == 'true') && 'closed-beta-recurring-restore' || 'closed-beta-recurring-capture' }}
          ACTOR: ${{ github.actor }}
          BETA_RECURRING_PREVENT_SELF_REVIEW: ${{ vars.BETA_RECURRING_PREVENT_SELF_REVIEW || 'false' }}
          BETA_RECURRING_ADMIN_BYPASS: ${{ vars.BETA_RECURRING_ADMIN_BYPASS || 'true' }}
        id: authorize
        run: |
          set -euo pipefail
          test "$RUN_REF" = "$SCHEDULER_REF"
          checkout_sha=$(timeout --foreground 30s git ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/dev | awk '{print $1}')
          test "$checkout_sha" != "$SCHEDULER_SHA"
          policy_file="$RUNNER_TEMP/recurring-policy.json"
          ci_file="$RUNNER_TEMP/recurring-ci.json"
          scripts/query-beta-recurring-policy.sh --output "$policy_file"
          scripts/query-beta-recurring-ci.sh --sha "$checkout_sha" --output "$ci_file"
          BETA_RECURRING_REQUIRE_POLICY=true \
            scripts/authorize-beta-recurring.sh \
              --event "${{ github.event_name }}" \
              --run-ref "$RUN_REF" \
              --default-ref "$SCHEDULER_REF" \
              --scheduler-sha "$SCHEDULER_SHA" \
              --checkout-sha "$checkout_sha" \
              --ci-sha "$checkout_sha" \
              --environment "$ENVIRONMENT" \
              --policy-file "$policy_file" \
              --ci-result-file "$ci_file" \
              --actor "$ACTOR" \
              --reviewer "${{ vars.BETA_RECURRING_REVIEWER || '' }}"
          {
            printf 'checkout_sha=%s\n' "$checkout_sha"
            printf 'environment=%s\n' "$ENVIRONMENT"
          } >>"$GITHUB_OUTPUT"

  capture:
    needs: admission
    if: vars.BETA_RECURRING_ACTIVATED == 'true' && github.event.schedule != '47 3 * * 1' && inputs.drill != 'true'
    runs-on: ubuntu-24.04
    environment:
      name: closed-beta-recurring-capture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 1
      - name: Select reviewed tooling revision
        env:
          CHECKOUT_SHA: ${{ needs.admission.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          timeout --foreground 30s git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Capture and publish scheduled point
        env:
          CAPTURE_COMMAND: ${{ vars.BETA_RECURRING_CAPTURE_COMMAND }}
          AGE_RECIPIENT: ${{ vars.BETA_RECURRING_AGE_RECIPIENT }}
          SLOT: ""
          SOURCE_REVISION: ${{ github.sha }}
          RUNTIME_REVISION: ${{ needs.admission.outputs.checkout_sha }}
          STORAGE_ROOT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$SCHEDULER_REF"
          test -n "$CAPTURE_COMMAND" -a -n "$AGE_RECIPIENT" -a -n "$STORAGE_ROOT"
          case "$CAPTURE_COMMAND" in
            "$GITHUB_WORKSPACE/"*) ;;
            scripts/*) CAPTURE_COMMAND="$GITHUB_WORKSPACE/$CAPTURE_COMMAND" ;;
            *) echo 'BACKUP_CAPTURE_BLOCKED:reviewed_capture_command_path' >&2; exit 1 ;;
          esac
          [ -x "$CAPTURE_COMMAND" ] && [ ! -L "$CAPTURE_COMMAND" ] || {
              echo 'BACKUP_CAPTURE_BLOCKED:reviewed_capture_command_required' >&2
              exit 1
            }
          scripts/authorize-beta-recovery.sh validate-age-recipient "$AGE_RECIPIENT"
          scripts/install-beta-recovery-age.sh "$RUNNER_TEMP/age"
          printf '%s\n' "$AGE_RECIPIENT" >"$RUNNER_TEMP/age-recipient"
          chmod 600 "$RUNNER_TEMP/age-recipient"
          SLOT="$(date -u +%y%m%d%H%M)"
          scripts/run-beta-recurring-capture.sh \
            --output "$RUNNER_TEMP/recurring-point" \
            --slot "$SLOT" \
            --captured-at "$(date -u +%s)" \
            --source-revision "$SOURCE_REVISION" \
            --runtime-revision "$RUNTIME_REVISION" \
            --contract-digest "$(sha256sum scripts/run-beta-recurring-capture.sh | awk '{print $1}')" \
            --proof-digest "$(sha256sum scripts/authorize-beta-recurring.sh | awk '{print $1}')" \
            --capture-command "$CAPTURE_COMMAND" \
            --capture-output "$RUNNER_TEMP/capture-source" \
            --age-binary "$RUNNER_TEMP/age/age" \
            --age-recipient-file "$RUNNER_TEMP/age-recipient" \
            --storage-root "$STORAGE_ROOT"

  protected-drill:
    needs: admission
    if: vars.BETA_RECURRING_ACTIVATED == 'true' && (github.event.schedule == '47 3 * * 1' || inputs.drill == 'true')
    runs-on: ubuntu-24.04
    environment:
      name: closed-beta-recurring-restore
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 1
      - name: Select reviewed tooling revision
        env:
          CHECKOUT_SHA: ${{ needs.admission.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          timeout --foreground 30s git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Run exact-version protected drill
        env:
          STORAGE_ROOT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}
          POINT_ID: ${{ vars.BETA_RECURRING_DRILL_POINT_ID }}
          RECEIPT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}/receipts/${{ vars.BETA_RECURRING_DRILL_POINT_ID }}/protected-receipt.json
          RESTORE_COMMAND: ${{ vars.BETA_RECURRING_RESTORE_COMMAND }}
          RESTORE_IDENTITY: ${{ secrets.BETA_RECURRING_RESTORE_IDENTITY }}
          REVIEWER_ID: ${{ vars.BETA_RECURRING_REVIEWER_ID }}
          REVIEWER_LOGIN: ${{ vars.BETA_RECURRING_REVIEWER }}
          APPROVAL_METADATA: ${{ secrets.BETA_RECURRING_APPROVAL_METADATA }}
          CHECKOUT_SHA: ${{ needs.admission.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$SCHEDULER_REF"
          test "${{ vars.BETA_RESTORE_PREVENT_SELF_REVIEW || 'false' }}" = true
          test "${{ vars.BETA_RESTORE_ADMIN_BYPASS || 'true' }}" = false
          test -n "$STORAGE_ROOT" -a -n "$POINT_ID" -a -n "$RESTORE_COMMAND" \
            -a -n "$RESTORE_IDENTITY" -a -n "$REVIEWER_ID" -a -n "$REVIEWER_LOGIN" \
            -a -n "$APPROVAL_METADATA"
          case "$RESTORE_COMMAND" in
            "$GITHUB_WORKSPACE/"*) ;;
            scripts/*) RESTORE_COMMAND="$GITHUB_WORKSPACE/$RESTORE_COMMAND" ;;
            *) echo 'BACKUP_CUSTODY_BLOCKED:reviewed_restore_command_path' >&2; exit 1 ;;
          esac
          [ -x "$RESTORE_COMMAND" ] && [ ! -L "$RESTORE_COMMAND" ] || {
              echo 'BACKUP_CUSTODY_BLOCKED:reviewed_restore_command_required' >&2
              exit 1
            }
          scripts/run-beta-backup-storage.sh reconcile --storage-root "$STORAGE_ROOT"
          test -d "$STORAGE_ROOT/points/$POINT_ID"
          test -s "$STORAGE_ROOT/points/$POINT_ID/point.json"
          policy_file="$RUNNER_TEMP/recurring-policy.json"
          ci_file="$RUNNER_TEMP/recurring-ci.json"
          approval_file="$RUNNER_TEMP/recurring-approval.json"
          post_approval_file="$RUNNER_TEMP/recurring-post-approval.json"
          scripts/query-beta-recurring-policy.sh --output "$policy_file"
          scripts/query-beta-recurring-ci.sh --sha "$CHECKOUT_SHA" --output "$ci_file"
          printf '%s' "$APPROVAL_METADATA" >"$approval_file"
          chmod 600 "$approval_file"
          cp -- "$approval_file" "$post_approval_file"
          export BETA_RECURRING_REQUIRE_APPROVAL=true
          scripts/authorize-beta-recurring.sh \
            --event "${{ github.event_name }}" --run-ref "$GITHUB_REF" \
            --default-ref "$SCHEDULER_REF" --scheduler-sha "${{ github.sha }}" \
            --checkout-sha "$CHECKOUT_SHA" --ci-sha "$CHECKOUT_SHA" \
            --environment closed-beta-recurring-restore \
            --policy-file "$policy_file" --ci-result-file "$ci_file" \
            --actor "$GITHUB_ACTOR" --reviewer "$REVIEWER_LOGIN" \
            --reviewer-id "$REVIEWER_ID" --approval-file "$approval_file" \
            --post-approval-file "$post_approval_file"
          protection_body="$RUNNER_TEMP/recurring-restore-protection-body.json"
          protection_file="$RUNNER_TEMP/recurring-restore-protection.json"
          jq -cS '{
            schema:"meet-backend/beta-recurring-restore-protection/v1",
            environment:.environment,branchPolicy:.branchPolicy,
            reviewerId:.reviewerId,reviewerRequired:.reviewerRequired,
            preventSelfReview:.preventSelfReview,
            adminBypassAllowed:.adminBypassAllowed
          }' "$post_approval_file" >"$protection_body"
          protection_digest=$(sha256sum "$protection_body" | awk '{print $1}')
          jq --arg digest "$protection_digest" \
            '. + {protectionDigest:$digest}' "$protection_body" >"$protection_file"
          identity_file="$RUNNER_TEMP/restore-identity"
          install -m 600 /dev/null "$identity_file"
          printf '%s\n' "$RESTORE_IDENTITY" >"$identity_file"
          unset RESTORE_IDENTITY APPROVAL_METADATA
          restore_output="$RUNNER_TEMP/restore-output"
          mkdir -p "$restore_output"
          capture_revision=$(jq -er '.capture.sourceRevision' \
            "$STORAGE_ROOT/points/$POINT_ID/recovery-point.json")
          scripts/run-beta-recurring-drill.sh \
            --storage-root "$STORAGE_ROOT" --point-id "$POINT_ID" --receipt "$RECEIPT" \
            --restore-command "$RESTORE_COMMAND" --restore-output "$restore_output" \
            --identity-file "$identity_file" --capture-revision "$capture_revision" \
            --restore-revision "$CHECKOUT_SHA" --reviewer-id "$REVIEWER_ID" \
            --protection-file "$protection_file" \
            --protection-digest "$protection_digest"
          rm -f -- "$identity_file"

  promote:
    needs: [protected-drill, admission]
    if: vars.BETA_RECURRING_ACTIVATED == 'true' && (github.event.schedule == '47 3 * * 1' || inputs.drill == 'true')
    runs-on: ubuntu-24.04
    environment:
      name: closed-beta-recurring-promote
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 1
      - name: Select reviewed tooling revision
        env:
          CHECKOUT_SHA: ${{ needs.admission.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          timeout --foreground 30s git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Promote verified receipt
        env:
          STORAGE_ROOT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}
          RECEIPT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}/${{ vars.BETA_RECURRING_DRILL_RECEIPT_RELATIVE_PATH }}
        run: |
          set -euo pipefail
          test -s "$RECEIPT" -a -n "$STORAGE_ROOT"
          scripts/run-beta-backup-storage.sh promote --storage-root "$STORAGE_ROOT" \
            --receipt "$RECEIPT" --owner promote

  prune:
    needs: [promote, admission]
    if: vars.BETA_RECURRING_ACTIVATED == 'true' && (github.event.schedule == '47 3 * * 1' || inputs.drill == 'true')
    runs-on: ubuntu-24.04
    environment:
      name: closed-beta-recurring-prune
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 1
      - name: Select reviewed tooling revision
        env:
          CHECKOUT_SHA: ${{ needs.admission.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          timeout --foreground 30s git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git checkout --detach "$CHECKOUT_SHA"
      - name: Prune retained points
        env:
          STORAGE_ROOT: ${{ secrets.BETA_BACKUP_STORAGE_ROOT }}
        run: |
          set -euo pipefail
          test -n "$STORAGE_ROOT"
          scripts/run-beta-backup-storage.sh prune --storage-root "$STORAGE_ROOT" \
            --now "$(date -u +%s)" --owner prune
