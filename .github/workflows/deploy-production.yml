name: Deploy backend release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published backend SemVer (without the v prefix)
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_HOST }}
    env:
      VERSION: ${{ inputs.version }}
      HOST: ${{ vars.PRODUCTION_HOST }}
      PORT: ${{ vars.PRODUCTION_PORT }}
      USER: ${{ vars.PRODUCTION_USER }}
      PATH_ON_HOST: ${{ vars.PRODUCTION_PATH }}
      HOST_FINGERPRINT: ${{ vars.PRODUCTION_SSH_HOST_FINGERPRINT }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
    steps:
      # Keep this as the first step: it must fail before repository-controlled
      # network access when the protected Environment is empty.
      - name: Protected-empty fail-before-network preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid release version" >&2
            exit 1
          }
          test -n "$HOST" || { echo "PRODUCTION_HOST is absent" >&2; exit 1; }
          test -n "$PORT" || { echo "PRODUCTION_PORT is absent" >&2; exit 1; }
          test -n "$USER" || { echo "PRODUCTION_USER is absent" >&2; exit 1; }
          test -n "$PATH_ON_HOST" || { echo "PRODUCTION_PATH is absent" >&2; exit 1; }
          test -n "$HOST_FINGERPRINT" || {
            echo "PRODUCTION_SSH_HOST_FINGERPRINT is absent" >&2
            exit 1
          }
          test -n "$SSH_PRIVATE_KEY" || {
            echo "PRODUCTION_SSH_PRIVATE_KEY is absent" >&2
            exit 1
          }
          [[ "$PORT" =~ ^[0-9]+$ ]] && [ "$PORT" -ge 1 ] && [ "$PORT" -le 65535 ] || {
            echo "PRODUCTION_PORT is invalid" >&2
            exit 1
          }
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "PRODUCTION_HOST is invalid" >&2; exit 1; }
          [[ "$USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || {
            echo "PRODUCTION_USER is invalid" >&2
            exit 1
          }
          [[ "$PATH_ON_HOST" =~ ^/[A-Za-z0-9._/-]+$ ]] && [[ "$PATH_ON_HOST" != *..* ]] || {
            echo "PRODUCTION_PATH must be a safe absolute path" >&2
            exit 1
          }
          [[ "$HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+$ ]] || {
            echo "SSH host fingerprint must be SHA256 format" >&2
            exit 1
          }
          grep -Eq '^-----BEGIN (OPENSSH|RSA) PRIVATE KEY-----$' <<<"$SSH_PRIVATE_KEY" || {
            echo "SSH private key envelope is invalid" >&2
            exit 1
          }
          echo "preflight=approved"

      - name: Checkout promotion-reviewed tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0
      - name: Resolve and verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx false
          gh release download "$tag" --pattern release-manifest.json --dir "$RUNNER_TEMP/release"
          jq -e --arg version "$VERSION" '
            .version == $version and .tag == ("v" + $version) and
            (.digest | test("^sha256:[0-9a-f]{64}$")) and
            (.aliases | length == 3) and (.aliases | index("latest") | not)
          ' "$RUNNER_TEMP/release/release-manifest.json"
          source_sha=$(jq -r '.sourceSha' "$RUNNER_TEMP/release/release-manifest.json")
          digest=$(jq -r '.digest' "$RUNNER_TEMP/release/release-manifest.json")
          image=$(jq -r '.image' "$RUNNER_TEMP/release/release-manifest.json")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin dev "$tag"
          test "$(git rev-list -n 1 "$tag")" = "$source_sha"
          git merge-base --is-ancestor "$source_sha" origin/dev
          gh attestation verify "oci://$image@$digest" --repo "$GITHUB_REPOSITORY"
          {
            echo "SOURCE_SHA=$source_sha"
            echo "DIGEST=$digest"
            echo "IMAGE=$image"
          } >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify deployment digest
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Config.User}}')" = "10001:10001"
      - name: Establish strict host trust
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/production-key"
          known_hosts="$RUNNER_TEMP/production-known-hosts"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          : > "$known_hosts"
          matched=0
          while IFS= read -r key_line; do
            fingerprint=$(printf '%s\n' "$key_line" | ssh-keygen -lf - -E sha256 | awk '{print $2}')
            if [ "$fingerprint" = "$HOST_FINGERPRINT" ]; then
              printf '%s\n' "$key_line" >> "$known_hosts"
              matched=$((matched + 1))
            fi
          done < <(ssh-keyscan -T 5 -p "$PORT" "$HOST" 2>/dev/null)
          [ "$matched" -eq 1 ] || {
            echo "host fingerprint did not match exactly one key" >&2
            exit 1
          }
          echo "KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS=$known_hosts" >> "$GITHUB_ENV"
      - name: Remote read-only preflight and digest pull
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh_opts=(-p "$PORT" -i "$KEY_FILE" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS" -o ConnectTimeout=10
            -o ConnectionAttempts=1)
          ssh "${ssh_opts[@]}" "$USER@$HOST" bash -s -- "$PATH_ON_HOST" "$IMAGE@$DIGEST" "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          path=$1
          image=$2
          revision=$3
          test -d "$path"
          test -x "$path/scripts/prepare-production-release.sh"
          test -x "$path/scripts/backup-production.sh"
          test -x "$path/scripts/update-production-release.sh"
          test -x "$path/scripts/deploy-production-release.sh"
          test -x "$path/scripts/rollback-production-release.sh"
          test -s "$path/.env.production"
          test -s "$path/.backup.env"
          command -v docker >/dev/null
          docker compose version >/dev/null
          command -v age >/dev/null
          grep -q '^AGE_RECIPIENT=' "$path/.backup.env"
          cd "$path"
          REMOTE
          quoted_path=$(printf '%q' "$PATH_ON_HOST")
          printf '%s' "$GHCR_TOKEN" |
            ssh "${ssh_opts[@]}" "$USER@$HOST" \
              "cd -- $quoted_path && docker login ghcr.io --username github-actions --password-stdin"
          ssh "${ssh_opts[@]}" "$USER@$HOST" bash -s -- "$PATH_ON_HOST" "$IMAGE@$DIGEST" "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          path=$1
          image=$2
          revision=$3
          cd "$path"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$revision"
          REMOTE
          ssh "${ssh_opts[@]}" "$USER@$HOST" "docker logout ghcr.io >/dev/null 2>&1 || true"
      - name: Capture, back up, deploy, and rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-p "$PORT" -i "$KEY_FILE" -o BatchMode=yes
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS" -o ConnectTimeout=10
            -o ConnectionAttempts=1)
          set +e
          ssh "${ssh_opts[@]}" "$USER@$HOST" bash -s -- "$PATH_ON_HOST" "$IMAGE@$DIGEST" "$SOURCE_SHA" <<'REMOTE'
          set -euo pipefail
          path=$1
          image=$2
          revision=$3
          cd "$path"
          scripts/prepare-production-release.sh >/dev/null
          scripts/backup-production.sh >/dev/null
          mutation_started=0
          trap 'status=$?; if [ "$status" -ne 0 ] && [ "$mutation_started" -eq 1 ]; then scripts/rollback-production-release.sh || echo rollback_failed >&2; fi; exit "$status"' EXIT
          scripts/update-production-release.sh "$image" "$revision" >/dev/null
          mutation_started=1
          scripts/deploy-production-release.sh >/dev/null
          REMOTE
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "deployment failed; remote rollback was attempted after mutation" >&2
            exit "$status"
          fi
          echo "deployment=ready digest=$DIGEST"
