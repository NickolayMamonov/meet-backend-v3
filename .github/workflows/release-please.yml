name: Backend release

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      release-id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Release Please manifest
        id: release
        uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  gates:
    name: Re-run release gates
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag }}

  publish:
    name: Publish immutable release
    needs: [release, gates]
    if: needs.release.outputs.created == 'true'
    concurrency:
      group: backend-ghcr-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      SOURCE_SHA: ${{ needs.release.outputs.sha }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect registry before publication
        id: registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          quarantine="$RUNNER_TEMP/release/preflight-quarantine.json"
          set +e
          result=$(scripts/release-registry-state.sh inspect "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$result"
          state=$(printf '%s\n' "$result" | awk -F= '/^state=/{print $2}')
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = complete ]; then
            digest=$(printf '%s\n' "$result" | awk -F= '/^digest=/{print $2}')
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -eq 42 ]; then
            test -s "$quarantine"
            gh release edit "$TAG" --draft --notes-file "$quarantine"
            echo "partial/divergent/raced aliases are quarantined; no GHCR repair is attempted" >&2
            exit 1
          fi
          [ "$status" -eq 0 ] && [ "$state" = empty -o "$state" = complete ]
      - name: Acquire create-only publication lease
        if: steps.registry.outputs.state == 'empty'
        run: scripts/acquire-release-lease.sh "$VERSION" "$SOURCE_SHA"
      - name: Build and publish exactly three aliases
        id: publish-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_STATE: ${{ steps.registry.outputs.state }}
          REGISTRY_DIGEST: ${{ steps.registry.outputs.digest }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test "$SOURCE_SHA" = "$(git rev-list -n 1 "$TAG")"
          test "$(jq -r '.version' version.json)" = "$VERSION"
          test "$(git show "$SOURCE_SHA:version.json" | jq -r '.version')" = "$VERSION"
          revision=$(git rev-parse HEAD)
          test "$revision" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/release"
          if [ "$REGISTRY_STATE" = complete ]; then
            digest="$REGISTRY_DIGEST"
          else
            test "$REGISTRY_STATE" = empty
            admission_quarantine="$RUNNER_TEMP/release/lease-quarantine.json"
            set +e
            admission=$(scripts/release-registry-state.sh inspect "$IMAGE" "$VERSION" "$SOURCE_SHA" \
              --quarantine-file "$admission_quarantine")
            status=$?
            set -e
            printf '%s\n' "$admission"
            if [ "$status" -eq 42 ]; then
              test -s "$admission_quarantine"
              gh release edit "$TAG" --draft --notes-file "$admission_quarantine"
              echo "registry changed after lease acquisition; no GHCR repair is attempted" >&2
              exit 1
            fi
            [ "$status" -eq 0 ]
            admission_state=$(awk -F= '/^state=/{print $2}' <<<"$admission")
            if [ "$admission_state" != empty ]; then
              jq -n --arg state "$admission_state" '{
                status: "quarantined",
                registryWrites: 0,
                observedState: $state,
                reason: "registry changed after publication lease"
              }' > "$admission_quarantine"
              gh release edit "$TAG" --draft --notes-file "$admission_quarantine"
              echo "registry was not empty after lease acquisition; no GHCR repair is attempted" >&2
              exit 1
            fi
            docker buildx build \
              --platform linux/amd64 \
              --provenance=true \
              --sbom=true \
              --push \
              --tag "$IMAGE:$TAG" \
              --tag "$IMAGE:$VERSION" \
              --tag "$IMAGE:sha-$SOURCE_SHA" \
              --build-arg "BACKEND_VERSION=$VERSION" \
              --build-arg "BACKEND_REVISION=$SOURCE_SHA" \
              --metadata-file "$RUNNER_TEMP/release/build-metadata.json" \
              .
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/release/build-metadata.json")
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE@$digest" --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh "$IMAGE@$digest" -ec \
            'test -f /app/app.jar && test -d /data/uploads && test -w /data/uploads'
          quarantine="$RUNNER_TEMP/release/post-publish-quarantine.json"
          set +e
          final_state=$(scripts/release-registry-state.sh inspect "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$final_state"
          if [ "$status" -eq 42 ]; then
            test -s "$quarantine"
            gh release edit "$TAG" --draft --notes-file "$quarantine"
            echo "post-publish registry race quarantined; no GHCR repair is attempted" >&2
            exit 1
          fi
          [ "$status" -eq 0 ]
          grep -Fx 'state=complete' <<<"$final_state"
          test "$(awk -F= '/^digest=/{print $2}' <<<"$final_state")" = "$digest"
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > image-index.json
          docker buildx imagetools inspect "$IMAGE@$digest" > image-inspect.txt
          evidence=$(scripts/verify-oci-evidence.sh "$IMAGE" "$digest" image-index.json)
          provenance=$(awk -F= '/^provenance=/{print $2}' <<<"$evidence")
          sbom=$(awk -F= '/^sbom=/{print $2}' <<<"$evidence")
          test "$provenance" = true
          test "$sbom" = true
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$digest" \
            --argjson provenance "$provenance" \
            --argjson sbom "$sbom" \
            '{
              version: $version,
              tag: $tag,
              sourceSha: $sourceSha,
              image: $image,
              digest: $digest,
              aliases: ["v" + $version, $version, "sha-" + $sourceSha],
              platform: "linux/amd64",
              publicationPolicy: "exactly-three-aliases-publish-last",
              provenance: $provenance,
              sbom: $sbom,
              artifactAttestation: true,
              evidence: ["image-index.json", "image-inspect.txt"]
            }' > release-manifest.json
          scripts/verify-release-consistency.sh "$VERSION" "$SOURCE_SHA" \
            --tag "$TAG" --image "$IMAGE@$digest" --manifest release-manifest.json
          sha256sum release-manifest.json image-index.json image-inspect.txt > SHA256SUMS
      - name: Create artifact attestation
        id: attestation
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true
      - name: Verify artifact attestation and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@${{ steps.publish-image.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
      - name: Attach evidence and publish last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-manifest.json image-index.json image-inspect.txt SHA256SUMS
          gh release edit "$TAG" --draft=false
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
