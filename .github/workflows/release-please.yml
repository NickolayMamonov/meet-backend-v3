name: Backend release

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  release:
    name: Release Please and resolve draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      route: ${{ steps.pre_action.outputs.route == 'recovery' && 'recovery' || steps.action_descriptor.outputs.route }}
      active: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.active || steps.action_descriptor.outputs.active }}
      source_sha: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.source_sha || steps.action_descriptor.outputs.source_sha }}
      release_tag: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.tag || steps.action_descriptor.outputs.tag }}
      release_version: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.version || steps.action_descriptor.outputs.version }}
      release_id: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.release_id || steps.action_descriptor.outputs.release_id }}
      observed_state: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.observed_state || steps.action_descriptor.outputs.observed_state }}
      observed_tag: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.observed_tag || steps.action_descriptor.outputs.observed_tag }}
      asset_inventory_kind: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.asset_inventory_kind || steps.action_descriptor.outputs.asset_inventory_kind }}
      asset_inventory_fingerprint: ${{ steps.pre_action.outputs.route == 'recovery' && steps.pre_action.outputs.asset_inventory_fingerprint || steps.action_descriptor.outputs.asset_inventory_fingerprint }}
    steps:
      - name: Checkout reviewed release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch exact origin/dev authority
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          test "$(git rev-parse origin/dev)" = \
            "$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
      - name: Classify current authority before Release Please
        id: pre_action
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          descriptor=$(scripts/resolve-release-descriptor.sh pre-action \
            --repository "$GITHUB_REPOSITORY" \
            --dev-ref origin/dev \
            --require-action-authority)
          printf '%s\n' "$descriptor"
          value() {
            awk -F= -v key="$1" '$1 == key {
              sub(/^[^=]*=/, "")
              print
            }' <<<"$descriptor"
          }
          for key in route active origin observed_state observed_tag release_id \
              tag version source_sha target_commitish draft published_at \
              authority_version authority_tag authority_source_sha \
              asset_inventory_kind asset_inventory_fingerprint; do
            echo "$key=$(value "$key")" >> "$GITHUB_OUTPUT"
          done
      - name: Release Please manifest
        id: release
        if: steps.pre_action.outputs.route == 'action'
        uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
      - name: Normalize action descriptor
        id: action_descriptor
        if: steps.pre_action.outputs.route == 'action'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          CREATED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED_VERSION: ${{ steps.release.outputs.version }}
          CREATED_SOURCE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CREATED" = true ]; then
            descriptor=$(scripts/resolve-release-descriptor.sh created \
              --repository "$GITHUB_REPOSITORY" \
              --dev-ref origin/dev \
              --release-id "$CREATED_RELEASE_ID" \
              --tag "$CREATED_TAG" \
              --version "$CREATED_VERSION" \
              --source-sha "$CREATED_SOURCE_SHA")
          else
            descriptor=$(scripts/resolve-release-descriptor.sh recover \
              --repository "$GITHUB_REPOSITORY" \
              --dev-ref origin/dev)
          fi
          printf '%s\n' "$descriptor"
          value() {
            awk -F= -v key="$1" '$1 == key {
              sub(/^[^=]*=/, "")
              print
            }' <<<"$descriptor"
          }
          echo "route=action" >> "$GITHUB_OUTPUT"
          for key in active origin observed_state observed_tag release_id tag \
              version source_sha target_commitish draft published_at \
              asset_inventory_kind asset_inventory_fingerprint; do
            echo "$key=$(value "$key")" >> "$GITHUB_OUTPUT"
          done

  gates:
    name: Re-run release gates
    needs: release
    if: needs.release.outputs.active == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_version: ${{ needs.release.outputs.release_version }}
      release_id: ${{ needs.release.outputs.release_id }}

  publish:
    name: Publish immutable release
    needs: [release, gates]
    if: needs.release.outputs.active == 'true' &&
        needs.release.outputs.route == 'action'
    concurrency:
      group: backend-ghcr-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      RELEASE_ID: ${{ needs.release.outputs.release_id }}
      TAG: ${{ needs.release.outputs.release_tag }}
      VERSION: ${{ needs.release.outputs.release_version }}
      SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
      ASSET_INVENTORY_KIND: ${{ needs.release.outputs.asset_inventory_kind }}
      ORIGINAL_ASSET_INVENTORY_FINGERPRINT: ${{ needs.release.outputs.asset_inventory_fingerprint }}
      ASSET_INVENTORY_FINGERPRINT: ${{ needs.release.outputs.asset_inventory_fingerprint }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
    steps:
      - name: Checkout reviewed publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - name: Checkout exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source
      - name: Independently verify the numeric draft descriptor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C tooling fetch --no-tags origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          descriptor=$(tooling/scripts/resolve-release-descriptor.sh verify \
            --repo-dir tooling \
            --repository "$GITHUB_REPOSITORY" \
            --dev-ref origin/dev \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --asset-inventory-fingerprint "$ORIGINAL_ASSET_INVENTORY_FINGERPRINT")
          value() {
            awk -F= -v key="$1" '$1 == key {
              sub(/^[^=]*=/, "")
              print
            }' <<<"$descriptor"
          }
          test "$(value active)" = true
          test "$(value origin)" = verified
          test "$(value release_id)" = "$RELEASE_ID"
          test "$(value tag)" = "$TAG"
          test "$(value version)" = "$VERSION"
          test "$(value source_sha)" = "$SOURCE_SHA"
          test "$(value asset_inventory_kind)" = "$ASSET_INVENTORY_KIND"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r '.version' source/version.json)" = "$VERSION"
          test "$TAG" = "v$VERSION"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify publication route
        id: admission
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          quarantine="$RUNNER_TEMP/release/preflight-quarantine.json"
          set +e
          result=$(tooling/scripts/release-registry-state.sh inspect \
            "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$result"
          state=$(awk -F= '/^state=/{print $2}' <<<"$result")
          latest=$(awk -F= '/^latest=/{print $2}' <<<"$result")
          registry_digest=$(awk -F= '/^digest=/{print $2}' <<<"$result")
          if [ "$status" -eq 42 ]; then
            test -s "$quarantine"
            route=quarantine
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          elif [ "$ASSET_INVENTORY_KIND" = empty ] &&
               [ "$state" = empty ] &&
               [ "$latest" = absent ]; then
            route=fresh
          elif [ "$ASSET_INVENTORY_KIND" = complete_unverified ] &&
               [ "$state" = complete ] &&
               [ "$latest" = absent ]; then
            route=resume
          elif [ "$ASSET_INVENTORY_KIND" = empty ] &&
               [ "$state" = complete ] &&
               [ "$latest" = absent ] &&
               [[ "$registry_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            route=resume-registry
          else
            jq -n \
              --arg assets "$ASSET_INVENTORY_KIND" \
              --arg registry "$state" \
              '{
                status: "quarantined",
                registryWrites: 0,
                assetInventory: $assets,
                registryState: $registry,
                reason: "release assets and registry state do not form an admissible publication route"
              }' > "$quarantine"
            route=quarantine
          fi
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "registry_digest=$registry_digest" >> "$GITHUB_OUTPUT"
          echo "quarantine=$quarantine" >> "$GITHUB_OUTPUT"
      - name: Quarantine inadmissible state by numeric release ID
        if: steps.admission.outputs.route == 'quarantine'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARANTINE_FILE: ${{ steps.admission.outputs.quarantine }}
        run: |
          set -euo pipefail
          jq -c . "$QUARANTINE_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "inadmissible release state; no release mutation was attempted" >&2
          exit 1
      - name: Acquire create-only publication lease
        if: steps.admission.outputs.route == 'fresh'
        working-directory: source
        run: ../tooling/scripts/acquire-release-lease.sh "$VERSION" "$SOURCE_SHA"
      - name: Recheck empty registry after lease
        if: steps.admission.outputs.route == 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          quarantine="$RUNNER_TEMP/release/lease-quarantine.json"
          descriptor=$(tooling/scripts/resolve-release-descriptor.sh verify \
            --repo-dir tooling \
            --repository "$GITHUB_REPOSITORY" \
            --dev-ref origin/dev \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --asset-inventory-fingerprint "$ORIGINAL_ASSET_INVENTORY_FINGERPRINT")
          printf '%s\n' "$descriptor" | grep -Fx 'asset_inventory_kind=empty'
          set +e
          result=$(tooling/scripts/release-registry-state.sh inspect \
            "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$result"
          state=$(awk -F= '/^state=/{print $2}' <<<"$result")
          latest=$(awk -F= '/^latest=/{print $2}' <<<"$result")
          if [ "$status" -eq 0 ] &&
             [ "$state" = empty ] &&
             [ "$latest" = absent ]; then
            exit 0
          fi
          if [ "$status" -ne 42 ]; then
            jq -n --arg state "$state" '{
              status: "quarantined",
              registryWrites: 0,
              observedState: $state,
              reason: "registry changed after publication lease"
            }' > "$quarantine"
          fi
          test -s "$quarantine"
          jq -c . "$quarantine" >> "$GITHUB_STEP_SUMMARY"
          echo "registry changed after lease; no release mutation was attempted" >&2
          exit 1
      - name: Build or resume exactly three aliases
        if: steps.admission.outputs.route == 'fresh' ||
            steps.admission.outputs.route == 'resume-registry'
        id: publish-image
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_ROUTE: ${{ steps.admission.outputs.route }}
          REGISTRY_DIGEST: ${{ steps.admission.outputs.registry_digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(jq -r '.version' version.json)" = "$VERSION"
          if [ "$PUBLICATION_ROUTE" = fresh ]; then
            docker buildx build \
              --platform linux/amd64 \
              --provenance=true \
              --sbom=true \
              --push \
              --tag "$IMAGE:$TAG" \
              --tag "$IMAGE:$VERSION" \
              --tag "$IMAGE:sha-$SOURCE_SHA" \
              --build-arg "BACKEND_VERSION=$VERSION" \
              --build-arg "BACKEND_REVISION=$SOURCE_SHA" \
              --metadata-file "$RUNNER_TEMP/release/build-metadata.json" \
              .
            digest=$(jq -r '."containerimage.digest"' \
              "$RUNNER_TEMP/release/build-metadata.json")
          else
            digest=$REGISTRY_DIGEST
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker pull "$IMAGE@$digest"
          test "$(docker image inspect "$IMAGE@$digest" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          test "$(docker image inspect "$IMAGE@$digest" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          test "$(docker image inspect "$IMAGE@$digest" \
            --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh "$IMAGE@$digest" -ec \
            'test -f /app/app.jar && test -d /data/uploads && test -w /data/uploads'
          quarantine="$RUNNER_TEMP/release/post-publish-quarantine.json"
          set +e
          final_state=$(../tooling/scripts/release-registry-state.sh inspect \
            "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$quarantine")
          status=$?
          set -e
          printf '%s\n' "$final_state"
          if [ "$status" -eq 42 ]; then
            test -s "$quarantine"
            jq -c . "$quarantine" >> "$GITHUB_STEP_SUMMARY"
            echo "post-publish registry race; no release mutation was attempted" >&2
            exit 1
          fi
          [ "$status" -eq 0 ]
          grep -Fx 'state=complete' <<<"$final_state"
          test "$(awk -F= '/^digest=/{print $2}' <<<"$final_state")" = "$digest"
          docker buildx imagetools inspect --raw "$IMAGE@$digest" > image-index.json
          docker buildx imagetools inspect "$IMAGE@$digest" > image-inspect.txt
          {
            echo "Platform: linux/amd64"
            echo "Version: $VERSION"
            echo "Revision: $SOURCE_SHA"
            echo "Source: https://github.com/$GITHUB_REPOSITORY"
          } >> image-inspect.txt
          evidence=$(../tooling/scripts/verify-oci-evidence.sh \
            "$IMAGE" "$digest" image-index.json)
          provenance=$(awk -F= '/^provenance=/{print $2}' <<<"$evidence")
          sbom=$(awk -F= '/^sbom=/{print $2}' <<<"$evidence")
          test "$provenance" = true
          test "$sbom" = true
          jq -n \
            --argjson releaseId "$RELEASE_ID" \
            --arg targetCommitish "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$digest" \
            --argjson provenance "$provenance" \
            --argjson sbom "$sbom" \
            '{
              releaseId: $releaseId,
              targetCommitish: $targetCommitish,
              version: $version,
              tag: $tag,
              sourceSha: $sourceSha,
              image: $image,
              digest: $digest,
              aliases: ["v" + $version, $version, "sha-" + $sourceSha],
              platform: "linux/amd64",
              publicationPolicy: "exactly-three-aliases-publish-last",
              provenance: $provenance,
              sbom: $sbom,
              artifactAttestation: true,
              evidence: ["image-index.json", "image-inspect.txt"]
            }' > release-manifest.json
          ../tooling/scripts/verify-release-consistency.sh \
            "$VERSION" "$SOURCE_SHA" \
            --image "$IMAGE" \
            --image-ref "$IMAGE@$digest" \
            --manifest release-manifest.json
          sha256sum \
            release-manifest.json \
            image-index.json \
            image-inspect.txt > SHA256SUMS
      - name: Create artifact attestation
        if: steps.admission.outputs.route == 'fresh' ||
            steps.admission.outputs.route == 'resume-registry'
        id: attestation
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish-image.outputs.digest }}
          push-to-registry: true
      - name: Verify attestation and checksums
        if: steps.admission.outputs.route == 'fresh' ||
            steps.admission.outputs.route == 'resume-registry'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://$IMAGE@${{ steps.publish-image.outputs.digest }}" \
            --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
      - name: Upload the exact evidence set by numeric release ID
        if: steps.admission.outputs.route == 'fresh' ||
            steps.admission.outputs.route == 'resume-registry'
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          quarantine_upload_failure() {
            status=$?
            trap - ERR
            set +e
            quarantine="$RUNNER_TEMP/release/upload-quarantine.json"
            jq -n '{
              status: "quarantined",
              repairWrites: 0,
              reason: "exact evidence upload did not complete"
            }' > "$quarantine"
            jq -c . "$quarantine" >> "$GITHUB_STEP_SUMMARY"
            echo "evidence upload failed; no release mutation was attempted" >&2
            exit "$status"
          }
          trap quarantine_upload_failure ERR
          descriptor=$(../tooling/scripts/resolve-release-descriptor.sh verify \
            --repo-dir ../tooling \
            --repository "$GITHUB_REPOSITORY" \
            --dev-ref origin/dev \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --asset-inventory-fingerprint "$ORIGINAL_ASSET_INVENTORY_FINGERPRINT")
          printf '%s\n' "$descriptor" | grep -Fx 'asset_inventory_kind=empty'
          test "$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '.assets | length')" -eq 0
          for file in \
            release-manifest.json \
            image-index.json \
            image-inspect.txt \
            SHA256SUMS
          do
            curl --fail-with-body --silent --show-error --location \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              >/dev/null
          done
          trap - ERR
      - name: Deep-verify resumable release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tooling/scripts/verify-release-resume-state.sh "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --image "$IMAGE"
      - name: Bind post-action asset fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release/post-action-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$release_json"
          post_action_fingerprint=$(
            printf '%s' "$(jq -c '
              [.assets[] | {
                name, id, size, state, created_at, updated_at, url
              }] | sort_by(.name)
            ' "$release_json")" |
              sha256sum | awk '{print $1}'
          )
          if [ "$ASSET_INVENTORY_KIND" = empty ]; then
            echo "POST_ACTION_ASSET_INVENTORY_FINGERPRINT=$post_action_fingerprint" \
              >>"$GITHUB_ENV"
            echo "ASSET_INVENTORY_FINGERPRINT=$post_action_fingerprint" \
              >>"$GITHUB_ENV"
          else
            test "$post_action_fingerprint" = \
              "$ORIGINAL_ASSET_INVENTORY_FINGERPRINT"
            echo "POST_ACTION_ASSET_INVENTORY_FINGERPRINT=$post_action_fingerprint" \
              >>"$GITHUB_ENV"
          fi
      - name: Final descriptor and deep admission, then publish last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release/final-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$release_json"
          fingerprint=$(
            printf '%s' "$(jq -c '
              [.assets[] | {
                name, id, size, state, created_at, updated_at, url
              }] | sort_by(.name)
            ' "$release_json")" |
              sha256sum | awk '{print $1}'
          )
          test "$POST_ACTION_ASSET_INVENTORY_FINGERPRINT" = \
            "$ASSET_INVENTORY_FINGERPRINT"
          test "$fingerprint" = "$ASSET_INVENTORY_FINGERPRINT"
          tooling/scripts/revalidate-release-mutation.sh \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --expected-fingerprint "$ASSET_INVENTORY_FINGERPRINT" \
            --repo-dir tooling \
            --dev-ref origin/dev
          tooling/scripts/verify-release-resume-state.sh "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --image "$IMAGE"
          tooling/scripts/mutate-release-metadata.sh publish \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --expected-fingerprint "$ASSET_INVENTORY_FINGERPRINT" \
            --repo-dir source
      - name: Read-only publication verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          published=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg target "$SOURCE_SHA" '
              .id == $id and
              .tag_name == $tag and
              .target_commitish == $target and
              .draft == false and
              .published_at != null
            ' <<<"$published" >/dev/null
          tooling/scripts/verify-release-tag-ref.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  recovery:
    name: Recover immutable release
    needs: [release, gates]
    if: needs.release.outputs.active == 'true' &&
        needs.release.outputs.route == 'recovery'
    concurrency:
      group: backend-ghcr-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      RELEASE_ID: ${{ needs.release.outputs.release_id }}
      TAG: ${{ needs.release.outputs.release_tag }}
      VERSION: ${{ needs.release.outputs.release_version }}
      SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
      OBSERVED_STATE: ${{ needs.release.outputs.observed_state }}
      OBSERVED_TAG: ${{ needs.release.outputs.observed_tag }}
      ORIGINAL_ASSET_INVENTORY_FINGERPRINT: ${{ needs.release.outputs.asset_inventory_fingerprint }}
      ASSET_INVENTORY_FINGERPRINT: ${{ needs.release.outputs.asset_inventory_fingerprint }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
    steps:
      - name: Checkout reviewed recovery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: tooling
      - name: Checkout exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: source
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Authenticate for read-only registry inspection
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deep-verify observed recovery state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$(git -C source rev-parse HEAD)"
          tooling/scripts/verify-release-resume-state.sh "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --image "$IMAGE" \
            --observed-state "$OBSERVED_STATE" \
            --observed-tag "$OBSERVED_TAG"
      - name: Bind observed recovery asset fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/recovery-observed-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$release_json"
          post_action_fingerprint=$(
            printf '%s' "$(jq -c '
              [.assets[] | {
                name, id, size, state, created_at, updated_at, url
              }] | sort_by(.name)
            ' "$release_json")" |
              sha256sum | awk '{print $1}'
          )
          test "$post_action_fingerprint" = \
            "$ORIGINAL_ASSET_INVENTORY_FINGERPRINT"
          echo "POST_ACTION_ASSET_INVENTORY_FINGERPRINT=$post_action_fingerprint" \
            >>"$GITHUB_ENV"
          echo "ASSET_INVENTORY_FINGERPRINT=$post_action_fingerprint" \
            >>"$GITHUB_ENV"
      - name: Canonicalize generated placeholder metadata
        if: env.OBSERVED_STATE == 'generated_placeholder'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tooling/scripts/mutate-release-metadata.sh canonicalize \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --expected-fingerprint "$ASSET_INVENTORY_FINGERPRINT" \
            --observed-tag "$OBSERVED_TAG" \
            --repo-dir source
      - name: Re-verify canonical draft before publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tooling/scripts/verify-release-resume-state.sh "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --image "$IMAGE"
      - name: Publish canonical release metadata last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/recovery-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$release_json"
          fingerprint=$(
            printf '%s' "$(jq -c '
              [.assets[] | {
                name, id, size, state, created_at, updated_at, url
              }] | sort_by(.name)
            ' "$release_json")" |
              sha256sum | awk '{print $1}'
          )
          test "$POST_ACTION_ASSET_INVENTORY_FINGERPRINT" = \
            "$ASSET_INVENTORY_FINGERPRINT"
          test "$fingerprint" = "$ASSET_INVENTORY_FINGERPRINT"
          tooling/scripts/revalidate-release-mutation.sh \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --tag "$TAG" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --expected-fingerprint "$ASSET_INVENTORY_FINGERPRINT" \
            --repo-dir tooling \
            --dev-ref origin/dev
          tooling/scripts/verify-release-resume-state.sh "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --image "$IMAGE"
          tooling/scripts/mutate-release-metadata.sh publish \
            --repository "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --target "$SOURCE_SHA" \
            --expected-fingerprint "$ASSET_INVENTORY_FINGERPRINT" \
            --repo-dir source
      - name: Read-only recovery verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e \
              --argjson id "$RELEASE_ID" \
              --arg tag "$TAG" \
              --arg source "$SOURCE_SHA" '
                .id == $id and .tag_name == $tag and
                .target_commitish == $source and
                .draft == false and .published_at != null
              ' >/dev/null
          tooling/scripts/verify-release-tag-ref.sh \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"
      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
