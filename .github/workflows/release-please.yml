name: Backend release

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  attestations: read

concurrency:
  group: backend-release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

env:
  IMMUTABLE_POLICY_READER_APP_ID: ${{ vars.IMMUTABLE_POLICY_READER_APP_ID }}

jobs:
  controller:
    name: Serialized future-only release controller
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      pull-requests: write
      packages: read
      attestations: read
    outputs:
      route: ${{ steps.route.outputs.route }}
      release_id: ${{ steps.route.outputs.release_id }}
      release_tag: ${{ steps.route.outputs.tag }}
      release_version: ${{ steps.route.outputs.version }}
      source_sha: ${{ steps.route.outputs.source_sha }}
    steps:
      - name: Checkout reviewed release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Fetch exact current-action authority
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/dev:refs/remotes/origin/dev'
          test "$(git rev-parse origin/dev)" = \
            "$(git ls-remote origin refs/heads/dev | awk '{print $1}')"

      - name: Mint and verify immutable-policy reader
        env:
          IMMUTABLE_POLICY_READER_PRIVATE_KEY: ${{ secrets.IMMUTABLE_POLICY_READER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/immutable-policy-reader.pem"
          umask 077
          test -n "${IMMUTABLE_POLICY_READER_APP_ID:-}"
          test -n "${IMMUTABLE_POLICY_READER_PRIVATE_KEY:-}"
          printf '%s\n' "$IMMUTABLE_POLICY_READER_PRIVATE_KEY" >"$key_file"
          token="$RUNNER_TEMP/immutable-policy-reader-token"
          scripts/verify-immutable-policy-reader-credential.sh \
            --repository "$GITHUB_REPOSITORY" \
            --app-id "$IMMUTABLE_POLICY_READER_APP_ID" \
            --private-key-file "$key_file" \
            --token-file "$token" \
            --output "$RUNNER_TEMP/immutable-policy-reader.json"
          test -s "$token"

      - name: Admit live immutable-release policy
        run: |
          set -euo pipefail
          scripts/verify-immutable-release-policy.sh \
            --repository "$GITHUB_REPOSITORY" \
            --token-file "$RUNNER_TEMP/immutable-policy-reader-token" \
            --credential-proof "$RUNNER_TEMP/immutable-policy-reader.json"

      - name: Enforce protected history before Release Please
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/MEE2-48-protected-history-before.json"
          scripts/capture-protected-release-snapshot.sh \
            --repository "$GITHUB_REPOSITORY" \
            --image ghcr.io/nickolaymamonov/meet-backend-v3 \
            --output "$current"
          scripts/verify-protected-release-snapshot.sh --snapshot "$current"
          sha256sum -c docs/evidence/MEE2-48-protected-history-v1.json.sha256
          cmp --silent docs/evidence/MEE2-48-protected-history-v1.json "$current"

      - name: Classify current action before Release Please
        id: pre_action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases_before="$RUNNER_TEMP/release-relevant-before.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c 'add // []' >"$releases_before"
          printf 'RELEASES_BEFORE_FILE=%s\n' "$releases_before" >>"$GITHUB_ENV"
          continuation_id=371012814
          continuation_tag=v1.2.0
          continuation_version=1.2.0
          continuation_source=9b6d2b06c0336ab8d153564dcf6328e81c4d7b36
          continuation_count=$(jq --argjson id "$continuation_id" '
            [.[] | select(
              .id == $id and .draft == true and
              (.published_at // null) == null
            )] | length
          ' "$releases_before")
          if [ "$continuation_count" -eq 1 ]; then
            registry_state="$RUNNER_TEMP/v1.2.0-continuation-registry.txt"
            scripts/release-registry-state.sh inspect \
              ghcr.io/nickolaymamonov/meet-backend-v3 \
              "$continuation_version" "$continuation_source" \
              --quarantine-file "$RUNNER_TEMP/v1.2.0-continuation-quarantine.json" \
              >"$registry_state"
            descriptor=$(scripts/admit-empty-release-continuation.sh \
              --repository "$GITHUB_REPOSITORY" --repo-dir . --dev-ref origin/dev \
              --release-id "$continuation_id" --tag "$continuation_tag" \
              --version "$continuation_version" --source-sha "$continuation_source" \
              --releases-file "$releases_before" \
              --registry-state-file "$registry_state")
          elif [ "$continuation_count" -eq 0 ]; then
            descriptor=$(scripts/resolve-release-descriptor.sh pre-action \
              --repository "$GITHUB_REPOSITORY" --dev-ref origin/dev \
              --releases-file "$releases_before")
          else
            echo "exact v1.2.0 continuation release is ambiguous" >&2
            exit 1
          fi
          printf '%s\n' "$descriptor"
          awk -F= '{print $1 "=" $2}' <<<"$descriptor" >>"$GITHUB_OUTPUT"

      - name: Release Please current action
        id: release
        if: steps.pre_action.outputs.route == 'action'
        uses: googleapis/release-please-action@c2a5a2bd6a758a0937f1ddb1e8950609867ed15c
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: dev
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          # The 1.1.0 boundary is PR-only; later authorities may publish
          # their fresh draft through the guarded materialization path.
          skip-github-release: ${{ steps.pre_action.outputs.version == '1.1.0' }}

      - name: Enforce protected history after Release Please
        if: steps.pre_action.outputs.route == 'action'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/MEE2-48-protected-history-after-action.json"
          scripts/capture-protected-release-snapshot.sh \
            --repository "$GITHUB_REPOSITORY" \
            --image ghcr.io/nickolaymamonov/meet-backend-v3 \
            --output "$current"
          scripts/verify-protected-release-snapshot.sh --snapshot "$current"
          sha256sum -c docs/evidence/MEE2-48-protected-history-v1.json.sha256
          cmp --silent docs/evidence/MEE2-48-protected-history-v1.json "$current"

      - name: Normalize action result and current-action set difference
        id: route
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ steps.release.outputs.sha }}
          PRE_ROUTE: ${{ steps.pre_action.outputs.route }}
          PRE_TAG: ${{ steps.pre_action.outputs.tag }}
          PRE_VERSION: ${{ steps.pre_action.outputs.version }}
          PRE_SOURCE_SHA: ${{ steps.pre_action.outputs.source_sha }}
          PRE_RELEASE_ID: ${{ steps.pre_action.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$PRE_ROUTE" != action ]; then
            test "$PRE_ROUTE" = materialize || test "$PRE_ROUTE" = completed
            echo "route=$PRE_ROUTE" >>"$GITHUB_OUTPUT"
            echo "release_id=$PRE_RELEASE_ID" >>"$GITHUB_OUTPUT"
            echo "tag=$PRE_TAG" >>"$GITHUB_OUTPUT"
            echo "version=$PRE_VERSION" >>"$GITHUB_OUTPUT"
            echo "source_sha=$PRE_SOURCE_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          normalized_release_created=$(
            scripts/normalize-release-please-action-output.sh \
              --release-created "$RELEASE_CREATED" \
              --tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --source-sha "$RELEASE_SOURCE_SHA"
          )
          case "$normalized_release_created" in
            true)
              releases_after="$RUNNER_TEMP/release-relevant-after.json"
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
                jq -c 'add // []' >"$releases_after"
              descriptor=$(scripts/resolve-release-descriptor.sh post-action \
                --repository "$GITHUB_REPOSITORY" --dev-ref origin/dev \
                --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
                --source-sha "$RELEASE_SOURCE_SHA" \
                --before-releases-file "$RELEASES_BEFORE_FILE" \
                --after-releases-file "$releases_after" \
                --release-created true)
              ;;
            false)
              releases_after="$RUNNER_TEMP/release-relevant-after.json"
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
                jq -c 'add // []' >"$releases_after"
              descriptor=$(scripts/resolve-release-descriptor.sh post-action \
                --repository "$GITHUB_REPOSITORY" --dev-ref origin/dev \
                --tag "$PRE_TAG" --version "$PRE_VERSION" \
                --source-sha "$PRE_SOURCE_SHA" --allow-completed \
                --before-releases-file "$RELEASES_BEFORE_FILE" \
                --after-releases-file "$releases_after" \
                --release-created false)
              ;;
          esac
          printf '%s\n' "$descriptor"
          awk -F= '{print $1 "=" $2}' <<<"$descriptor" >>"$GITHUB_OUTPUT"

  gates:
    name: Backend CI for exact release source
    needs: controller
    if: needs.controller.outputs.route == 'materialize'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.controller.outputs.source_sha }}
      source_sha: ${{ needs.controller.outputs.source_sha }}
      release_tag: ${{ needs.controller.outputs.release_tag }}
      release_version: ${{ needs.controller.outputs.release_version }}
      release_id: ${{ needs.controller.outputs.release_id }}

  publish:
    name: One-shot publish-last materialization
    needs: [controller, gates]
    if: needs.controller.outputs.route == 'materialize'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_ID: ${{ needs.controller.outputs.release_id }}
      TAG: ${{ needs.controller.outputs.release_tag }}
      VERSION: ${{ needs.controller.outputs.release_version }}
      SOURCE_SHA: ${{ needs.controller.outputs.source_sha }}
      IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
      IMMUTABLE_POLICY_READER_APP_ID: ${{ vars.IMMUTABLE_POLICY_READER_APP_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed publication tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout exact publication source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.controller.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Verify reader and policy before every writer
        env:
          IMMUTABLE_POLICY_READER_PRIVATE_KEY: ${{ secrets.IMMUTABLE_POLICY_READER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/immutable-policy-reader.pem"
          umask 077
          printf '%s\n' "$IMMUTABLE_POLICY_READER_PRIVATE_KEY" >"$key_file"
          scripts/verify-immutable-policy-reader-credential.sh \
            --repository "$GITHUB_REPOSITORY" \
            --app-id "$IMMUTABLE_POLICY_READER_APP_ID" \
            --private-key-file "$key_file" \
            --token-file "$RUNNER_TEMP/reader-token" \
            --output "$RUNNER_TEMP/reader-proof.json"
          scripts/verify-immutable-release-policy.sh \
            --repository "$GITHUB_REPOSITORY" \
            --token-file "$RUNNER_TEMP/reader-token" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Verify exact v1.2.0 publication tuple
        run: |
          set -euo pipefail
          test "$TAG" = "v1.2.0"
          test "$VERSION" = "1.2.0"
          test "$TAG" = "v$VERSION"
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Enforce protected history before publication writers
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/MEE2-48-protected-history-before-writers.json"
          scripts/capture-protected-release-snapshot.sh \
            --repository "$GITHUB_REPOSITORY" --image "$IMAGE" \
            --output "$current"
          scripts/verify-protected-release-snapshot.sh --snapshot "$current"
          sha256sum -c docs/evidence/MEE2-48-protected-history-v1.json.sha256
          cmp --silent docs/evidence/MEE2-48-protected-history-v1.json "$current"

      - name: Set up attestation-capable Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Revalidate policy before image writer
        run: |
          set -euo pipefail
          scripts/verify-immutable-release-policy.sh \
            --repository "$GITHUB_REPOSITORY" \
            --token-file "$RUNNER_TEMP/reader-token" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Admit empty candidate registry
        run: |
          set -euo pipefail
          registry_state="$RUNNER_TEMP/registry-before-image.txt"
          scripts/release-registry-state.sh inspect "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$RUNNER_TEMP/registry-quarantine.json" \
            >"$registry_state"
          grep -Fx "v$VERSION absent" "$registry_state"
          grep -Fx "$VERSION absent" "$registry_state"
          grep -Fx "sha-$SOURCE_SHA absent" "$registry_state"
          latest=$(awk -F= '$1 == "latest" { print $2 }' "$registry_state")
          [ "$latest" = absent ]

      - name: Revalidate live empty draft before first image push
        run: |
          set -euo pipefail
          scripts/revalidate-release-mutation.sh \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --expected-route materialize --phase empty \
            --policy-token-file "$RUNNER_TEMP/reader-token" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Build exact image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true \
            --tag "$IMAGE:$TAG" --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:sha-$SOURCE_SHA" --push \
            --build-arg "BACKEND_VERSION=$VERSION" \
            --build-arg "BACKEND_REVISION=$SOURCE_SHA" source

      - name: Verify exact candidate registry convergence
        run: |
          set -euo pipefail
          registry_state="$RUNNER_TEMP/registry-after-image.txt"
          scripts/release-registry-state.sh inspect "$IMAGE" "$VERSION" "$SOURCE_SHA" \
            --quarantine-file "$RUNNER_TEMP/registry-quarantine-after-image.json" \
            >"$registry_state"
          digest=$(awk -v alias="v$VERSION" '$1 == alias { print $2 }' "$registry_state")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          for alias in "v$VERSION" "$VERSION" "sha-$SOURCE_SHA"; do
            grep -Fx "$alias $digest" "$registry_state"
          done
          latest=$(awk -F= '$1 == "latest" { print $2 }' "$registry_state")
          [ "$latest" = absent ]

      - name: Generate deterministic release evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          docker pull "$IMAGE:$TAG"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw \
            >"$RUNNER_TEMP/release-assets/image-index.json"
          docker buildx imagetools inspect "$IMAGE:$TAG" \
            >"$RUNNER_TEMP/release-assets/image-inspect.txt"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" >"$RUNNER_TEMP/image-digest.txt"

      - name: Revalidate policy before workflow artifact attestation
        run: |
          set -euo pipefail
          scripts/verify-immutable-release-policy.sh \
            --repository "$GITHUB_REPOSITORY" \
            --token-file "$RUNNER_TEMP/reader-token" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Create workflow artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-assets/image-index.json

      - name: Verify workflow artifact attestation
        id: verify_artifact_attestation
        env:
          ARTIFACT: ${{ runner.temp }}/release-assets/image-index.json
        run: |
          set -euo pipefail
          artifact_sha=$(sha256sum "$ARTIFACT" | awk '{print $1}')
          gh attestation verify "$ARTIFACT" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release-please.yml" \
            --format json \
            >"$RUNNER_TEMP/workflow-artifact-attestation.json"
          jq -e --arg digest "$artifact_sha" '
            type == "array" and length > 0 and
            any(.[]?;
              (.verificationResult.statement.subject // []) |
              any(.[]?; .digest.sha256? == $digest)
            )
          ' "$RUNNER_TEMP/workflow-artifact-attestation.json" >/dev/null
          echo "verified=true" >>"$GITHUB_OUTPUT"

      - name: Generate deterministic release manifest
        run: |
          set -euo pipefail
          digest=$(sed -n '1p' "$RUNNER_TEMP/image-digest.txt")
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg image "$IMAGE" \
            --arg tag "$TAG" --arg version "$VERSION" --arg source "$SOURCE_SHA" \
            --arg digest "$digest" --argjson release_id "$RELEASE_ID" \
            --argjson artifact_attestation "${{ steps.verify_artifact_attestation.outputs.verified }}" '{
              schema:"meet-backend/release-evidence/v1",
              repository:$repository,image:$image,tag:$tag,version:$version,
              releaseId:$release_id,sourceSha:$source,
              digest:$digest,
              aliases:[$tag,$version,("sha-"+$source)],
              platform:"linux/amd64",
              publicationPolicy:"exactly-three-aliases-publish-last",
              provenance:true,sbom:true,artifactAttestation:$artifact_attestation,
              evidence:["image-index.json","image-inspect.txt"]
            }' >"$RUNNER_TEMP/release-assets/release-manifest.json"
          scripts/verify-release-consistency.sh "$VERSION" "$SOURCE_SHA" \
            --tag "$TAG" --image "$IMAGE" --image-ref "$IMAGE:$TAG" \
            --manifest "$RUNNER_TEMP/release-assets/release-manifest.json"
          (
            cd "$RUNNER_TEMP/release-assets"
            sha256sum release-manifest.json image-index.json image-inspect.txt \
              >SHA256SUMS
            sha256sum -c SHA256SUMS >/dev/null
          )

      - name: Upload deterministic release assets
        run: |
          set -euo pipefail
          # Fixed, closed evidence inventory:
          # release-manifest.json image-index.json image-inspect.txt SHA256SUMS
          scripts/upload-release-assets.sh \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --policy-token-file "$RUNNER_TEMP/reader-token" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Revalidate policy and publish last
        env:
          IMMUTABLE_POLICY_READER_TOKEN_FILE: ${{ runner.temp }}/reader-token
        run: |
          set -euo pipefail
          scripts/revalidate-release-mutation.sh \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --expected-route materialize --phase complete \
            --policy-token-file "$IMMUTABLE_POLICY_READER_TOKEN_FILE" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"
          scripts/verify-release-tag-ref.sh \
            --repository "$GITHUB_REPOSITORY" --tag v1.1.0 \
            --source-sha 36ffd11ea4d35147f1df9c1cafa6a330300c1339 \
            --expect-absent
          scripts/verify-release-tag-ref.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --source-sha "$SOURCE_SHA" --expect-absent
          scripts/mutate-release-metadata.sh publish \
            --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --policy-token-file "$IMMUTABLE_POLICY_READER_TOKEN_FILE" \
            --credential-proof "$RUNNER_TEMP/reader-proof.json"

      - name: Read-only immutable release proof
        run: |
          set -euo pipefail
          scripts/verify-immutable-release-proof.sh \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --release-id "$RELEASE_ID" --source-sha "$SOURCE_SHA" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            >"$RUNNER_TEMP/MEE2-48-v1.2.0-immutability-proof.json"
          sha256sum "$RUNNER_TEMP/MEE2-48-v1.2.0-immutability-proof.json" \
            >"$RUNNER_TEMP/MEE2-48-v1.2.0-immutability-proof.json.sha256"

      - name: Enforce protected history after publication
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/MEE2-48-protected-history-after-publication.json"
          scripts/capture-protected-release-snapshot.sh \
            --repository "$GITHUB_REPOSITORY" --image "$IMAGE" \
            --output "$current"
          scripts/verify-protected-release-snapshot.sh --snapshot "$current"
          sha256sum -c docs/evidence/MEE2-48-protected-history-v1.json.sha256
          cmp --silent docs/evidence/MEE2-48-protected-history-v1.json "$current"

      - name: Upload normalized proof only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEE2-48-v1.2.0-immutability-proof
          path: |
            ${{ runner.temp }}/MEE2-48-v1.2.0-immutability-proof.json
            ${{ runner.temp }}/MEE2-48-v1.2.0-immutability-proof.json.sha256
