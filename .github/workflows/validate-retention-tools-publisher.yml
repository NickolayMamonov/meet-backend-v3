name: Validate retention tools publisher

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  publisher-tests:
    name: Synthetic publisher admission and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Run synthetic admission and image inspection tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python3 -I -B scripts/test-retention-tools-publisher.py
          timeout 30s python3 -I -B -c '
          from pathlib import Path
          for name in (
              "scripts/retention-tools-publisher.py",
              "scripts/inspect-retention-tools-image.py",
              "scripts/test-retention-tools-publisher.py",
          ):
              compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          '
      - name: Validate the publisher workflows with pinned actionlint
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          actionlint_version=1.7.7
          actionlint_sha256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          archive="$RUNNER_TEMP/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          binary="$RUNNER_TEMP/actionlint"
          timeout 65s curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 \
            --max-filesize 50M \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/actionlint_${actionlint_version}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$actionlint_sha256" "$archive" |
            sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          test -f "$binary"
          test ! -L "$binary"
          test -x "$binary"
          timeout 30s "$binary" -shellcheck "" \
            .github/workflows/prepare-retention-proof-tools.yml \
            .github/workflows/validate-retention-tools-publisher.yml
