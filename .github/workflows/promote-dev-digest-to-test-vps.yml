name: Promote exact dev digest to test VPS

run-name: Promote dev ${{ inputs.source_sha }} to test VPS

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-hex current dev commit
        required: true
        type: string
      allow_same_digest_redeploy:
        description: Allow same-image redeploy without rollback proof
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read

env:
  IMAGE: ghcr.io/nickolaymamonov/meet-backend-v3
  PROMOTION_WORKFLOW: .github/workflows/promote-dev-digest-to-test-vps.yml

jobs:
  authorize:
    name: Authorize exact reviewed dev source
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.sha == inputs.source_sha
    runs-on: ubuntu-24.04
    environment: closed-beta-promotion
    permissions:
      contents: read
      actions: read
    outputs:
      authorized: ${{ steps.authority.outputs.authorized }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
      tree_id: ${{ steps.authority.outputs.tree_id }}
      version: ${{ steps.authority.outputs.version }}
    steps:
      - name: Checkout exact detached dev source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: authority
        name: Prove current dev authority and registration identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/dev ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin dev master
          [[ "$(git rev-parse refs/remotes/origin/dev)" == "$SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          ! git symbolic-ref -q HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          tree_id=$(git rev-parse HEAD^{tree})
          version=$(jq -er 'keys == ["version"] and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .version' version.json)
          test "$(git show "refs/remotes/origin/master:$PROMOTION_WORKFLOW" | sha256sum | awk '{print $1}')" =
            "$(git show "refs/remotes/origin/dev:$PROMOTION_WORKFLOW" | sha256sum | awk '{print $1}')"
          ci_sha=$(gh run list --workflow ci.yml --commit "$SOURCE_SHA" --limit 20 \
            --json headSha,status,conclusion --jq '
              map(select(.headSha == "'"$SOURCE_SHA"'" and .status == "completed" and .conclusion == "success"))
              | length')
          test "$ci_sha" -ge 1
          {
            echo "authorized=true"
            echo "source_sha=$SOURCE_SHA"
            echo "tree_id=$tree_id"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  admit-image:
    name: Admit immutable test image and protected closure
    needs: authorize
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.sha == inputs.source_sha && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    environment: closed-beta-promotion
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      root_digest: ${{ steps.publish.outputs.root_digest }}
      platform_digest: ${{ steps.publish.outputs.platform_digest }}
      admission_mode: ${{ steps.publish.outputs.admission_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Inspect local OCI layout before any registry write
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true --build-arg "BACKEND_VERSION=$VERSION" --build-arg "BACKEND_REVISION=$SOURCE_SHA" --output "type=oci,dest=$RUNNER_TEMP/test-image.oci.tar" .
          test -s "$RUNNER_TEMP/test-image.oci.tar"
          mkdir "$RUNNER_TEMP/test-image-layout"
          tar -xf "$RUNNER_TEMP/test-image.oci.tar" -C "$RUNNER_TEMP/test-image-layout"
          jq -e '.imageLayoutVersion == "1.0.0"' "$RUNNER_TEMP/test-image-layout/oci-layout" >/dev/null
          jq -e '([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1' "$RUNNER_TEMP/test-image-layout/index.json" >/dev/null
          protected_digests=$(gh api --paginate --slurp "users/${GITHUB_REPOSITORY%%/*}/packages/container/${GITHUB_REPOSITORY##*/}/versions?per_page=100" 2>/dev/null | jq -r 'add // [] | .[] | .name // empty') || { echo "protected registry state read failed" >&2; exit 1; }
          while IFS= read -r digest; do
            [ -z "$digest" ] || ! grep -Fxq "$digest" <<<"$protected_digests" || { echo "candidate OCI digest collides with protected registry state" >&2; exit 1; }
          done < <(jq -r '[.manifests[]?.digest] | .[]' "$RUNNER_TEMP/test-image-layout/index.json")
      - id: publish
        name: Publish or safely reuse only the source-bound test alias
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.authorize.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          alias="test-sha-$SOURCE_SHA"
          ref="$IMAGE:$alias"
          mode=reused
          if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            mode=published
            printf "%s" "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            docker buildx build --platform linux/amd64 --provenance=true --sbom=true --build-arg "BACKEND_VERSION=$VERSION" --build-arg "BACKEND_REVISION=$SOURCE_SHA" --tag "$ref" --push .
          fi
          bash scripts/admit-test-image.sh verify --source "$SOURCE_SHA" --version "$VERSION" --alias "$alias" --input-command scripts/read-test-image-state.sh
          root_digest=$(docker buildx imagetools inspect "$ref" --format "{{.Manifest.Digest}}")
          raw="$RUNNER_TEMP/test-image-index.json"
          docker buildx imagetools inspect "$ref" --raw >"$raw"
          platform_digest=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else empty end' "$raw")
          scripts/verify-oci-evidence.sh "$IMAGE" "$root_digest" "$raw" >/dev/null
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" >/dev/null
          printf "root_digest=$root_digest
platform_digest=$platform_digest
admission_mode=$mode
" >>"$GITHUB_OUTPUT"
      - name: Read-only image admission
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/dev ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          bash scripts/admit-test-image.sh verify \
            --source "$SOURCE_SHA" --version "$VERSION" --alias "test-sha-$SOURCE_SHA" --input-command scripts/read-test-image-state.sh
          test ! -e release.json
          test ! -e protected-state-write.marker

  deploy:
    name: Locked exact-digest test VPS deployment
    needs: [authorize, admit-image]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.sha == inputs.source_sha && needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    environment: test-vps
    env:
      HOST: ${{ vars.TEST_VPS_HOST }}
      PORT: ${{ vars.TEST_VPS_PORT }}
      SSH_USER: ${{ vars.TEST_VPS_USER }}
      PATH_ON_HOST: ${{ vars.TEST_VPS_PATH }}
      HOST_FINGERPRINT: ${{ vars.TEST_VPS_SSH_HOST_FINGERPRINT }}
      SSH_PRIVATE_KEY: ${{ secrets.TEST_VPS_SSH_PRIVATE_KEY }}
      PUBLIC_URL: https://api.whysoezzy.online
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      target_image_id: ${{ steps.deploy.outputs.target_image_id }}
      previous_image_id: ${{ steps.deploy.outputs.previous_image_id }}
      rollback_verified: ${{ steps.deploy.outputs.rollback_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Revalidate exact source before mutation
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/dev ]]
          [[ "$GITHUB_SHA" == "$SOURCE_SHA" ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Establish strict SSH host trust
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/test-vps-key"
          known_hosts="$RUNNER_TEMP/test-vps-known-hosts"
          ssh_config="$RUNNER_TEMP/test-vps-ssh-config"
          umask 077
          echo "$SSH_PRIVATE_KEY" >"$key_file"
          chmod 600 "$key_file"
          : >"$known_hosts"
          matched=0
          while IFS= read -r line; do
            fingerprint=$(echo "$line" | ssh-keygen -lf - -E sha256 | awk "{print $2}")
            if [ "$fingerprint" = "$HOST_FINGERPRINT" ]; then echo "$line" >>"$known_hosts"; matched=$((matched + 1)); fi
          done < <(ssh-keyscan -T 5 -p "$PORT" "$HOST" 2>/dev/null)
          [ "$matched" -eq 1 ]
          { echo "Host test-vps"; echo "  HostName $HOST"; echo "  Port $PORT"; echo "  User $SSH_USER"; echo "  IdentityFile $key_file"; echo "  UserKnownHostsFile $known_hosts"; echo "  BatchMode yes"; echo "  IdentitiesOnly yes"; echo "  StrictHostKeyChecking yes"; } >"$ssh_config"
          chmod 600 "$ssh_config"
          echo "SSH_CONFIG=$ssh_config" >>"$GITHUB_ENV"
      - name: Deploy exact digest with locked rollback-aware tooling
        id: deploy
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ needs.authorize.outputs.version }}
          IMAGE_DIGEST: ${{ needs.admit-image.outputs.root_digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          stage="$RUNNER_TEMP/test-vps-tooling"
          remote="$PATH_ON_HOST/.mee2-53-tooling-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$stage/scripts"
          for file in docker-compose.production.yml scripts/production-compose.sh scripts/production-config-digest.sh scripts/test-vps-runtime-invariants.sh scripts/update-production-release.sh scripts/deploy-test-vps-release.sh scripts/verify-test-vps-closed-beta-state.sh; do mkdir -p "$stage/$(dirname "$file")"; cp -- "$file" "$stage/$file"; done
          tar -C "$stage" -cf "$RUNNER_TEMP/test-vps-tooling.tar" .
          ssh -F "$SSH_CONFIG" test-vps bash -s -- "$PATH_ON_HOST" "$remote" <<"REMOTE"
          set -euo pipefail
          root=$1; stage=$2; [ -d "$root" ] && [ -s "$root/.env.production" ]; grep -Eq "^DEMO_CATALOG_BOOTSTRAP_ENABLED=false$" "$root/.env.production"; [ ! -e "$stage" ]; install -d -m 700 "$stage"
          REMOTE
          scp -F "$SSH_CONFIG" "$RUNNER_TEMP/test-vps-tooling.tar" "test-vps:$remote/tooling.tar"
          ssh -F "$SSH_CONFIG" test-vps bash -s -- "$remote" <<"REMOTE"
          set -euo pipefail
          tar -xf "$1/tooling.tar" -C "$1"; chmod 755 "$1"/scripts/*.sh
          REMOTE
          target_id=$(ssh -F "$SSH_CONFIG" test-vps bash -s -- "$IMAGE@$IMAGE_DIGEST" "$SOURCE_SHA" "$VERSION" <<"REMOTE"
          set -euo pipefail
          image=$1; revision=$2; version=$3; docker pull "$image" >/dev/null
          test "$(docker image inspect "$image" --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}")" = "$revision"
          test "$(docker image inspect "$image" --format "{{index .Config.Labels \"org.opencontainers.image.version\"}}")" = "$version"
          docker image inspect "$image" --format "{{.Id}}"
          REMOTE
          )
          [[ "$target_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "target_image_id=$target_id" >>"$GITHUB_OUTPUT"
          previous_id=$(ssh -F "$SSH_CONFIG" test-vps bash -s <<"REMOTE"
          set -euo pipefail
          mapfile -t c < <(docker ps -q --filter label=com.docker.compose.project=meet-production --filter label=com.docker.compose.service=backend)
          [ "${#c[@]}" -eq 1 ]
          docker inspect "${c[0]}" --format "{{.Image}}"
          REMOTE
          )
          echo "previous_image_id=$previous_id" >>"$GITHUB_OUTPUT"
          echo "rollback_verified=false" >>"$GITHUB_OUTPUT"
          if [ "$previous_id" != "$target_id" ] && [ "${{ inputs.allow_same_digest_redeploy }}" = false ]; then
            set +e
            ssh -F "$SSH_CONFIG" test-vps "$remote/scripts/deploy-test-vps-release.sh" --root "$PATH_ON_HOST" --base-compose "$remote/docker-compose.production.yml" --image "$IMAGE@$IMAGE_DIGEST" --revision "$SOURCE_SHA" --version "$VERSION" --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --mode rollback-drill --closed-beta-safety >"$RUNNER_TEMP/rollback.txt" 2>&1
            status=$?
            set -e
            [ "$status" -eq 86 ]
            grep -Fq "rollback=completed previous_image_id=$previous_id" "$RUNNER_TEMP/rollback.txt"
            echo "rollback_verified=true" >>"$GITHUB_OUTPUT"
          fi
          ssh -F "$SSH_CONFIG" test-vps "$remote/scripts/deploy-test-vps-release.sh" --root "$PATH_ON_HOST" --base-compose "$remote/docker-compose.production.yml" --image "$IMAGE@$IMAGE_DIGEST" --revision "$SOURCE_SHA" --version "$VERSION" --run-key "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final" --mode deploy --closed-beta-safety
          ssh -F "$SSH_CONFIG" test-vps bash -s -- "$target_id" "$SOURCE_SHA" "$VERSION" "$PUBLIC_URL" <<"REMOTE"
          set -euo pipefail
          id=$1; revision=$2; version=$3; public=$4
          mapfile -t c < <(docker ps -q --filter label=com.docker.compose.project=meet-production --filter label=com.docker.compose.service=backend)
          [ "${#c[@]}" -eq 1 ]; backend=${c[0]}; [ "$(docker inspect "$backend" --format "{{.Image}}")" = "$id" ]
          [ "$(docker inspect "$backend" --format "{{.State.Health.Status}}")" = healthy ]
          [ "$(docker inspect "$backend" --format "{{index .Config.Labels \"org.opencontainers.image.revision\"}}")" = "$revision" ]
          [ "$(docker inspect "$backend" --format "{{index .Config.Labels \"org.opencontainers.image.version\"}}")" = "$version" ]
          docker volume inspect meet-production_postgres_data >/dev/null; docker volume inspect meet-production_uploads_data >/dev/null
          REMOTE
          curl --fail --silent --show-error "$PUBLIC_URL/meetings" | jq -e 'type == "array"' >/dev/null
          missing_admin=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" -X POST "$PUBLIC_URL/admin/demo-catalog/bootstrap" -H "Content-Type: application/json" --data "{}")
          wrong_admin=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" -X POST "$PUBLIC_URL/admin/demo-catalog/bootstrap" -H "X-Admin-Key: wrong" -H "Content-Type: application/json" --data "{}")
          [ "$missing_admin" = 403 ] && [ "$wrong_admin" = 403 ]
          curl --fail --silent --show-error "$PUBLIC_URL/demo-events/networking-online" -o "$RUNNER_TEMP/networking-online"
          curl --fail --silent --show-error "$PUBLIC_URL/demo-events/organize-online" -o "$RUNNER_TEMP/organize-online"
          [ "$(sha256sum "$RUNNER_TEMP/networking-online" | awk "{print $1}")" = bb8fb77c0e5aa135655ecd6de1857295d3282571 ]
          [ "$(sha256sum "$RUNNER_TEMP/organize-online" | awk "{print $1}")" = 849c92d104344d3bb6c1d096f6e866c8f24cbea6 ]
          ssh -F "$SSH_CONFIG" test-vps bash -s -- "$PATH_ON_HOST" <<"REMOTE"
          set -euo pipefail
          grep -Eq "^DEMO_CATALOG_BOOTSTRAP_ENABLED=false$" "$1/.env.production"
          REMOTE

  retention:
    name: Success-only retention authorization
    needs: [authorize, admit-image, deploy]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.sha == inputs.source_sha && needs.authorize.outputs.authorized == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    environment: test-vps
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authorize retention only after final evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/dev ]]
          [[ "$GITHUB_SHA" == "${{ inputs.source_sha }}" ]]
          test "${{ needs.deploy.result }}" = success
          test "${{ needs.authorize.outputs.authorized }}" = true
          echo "retentionAuthorized=true"
