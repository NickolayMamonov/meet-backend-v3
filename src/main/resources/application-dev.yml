# Enable with SPRING_PROFILES_ACTIVE=dev.
spring:
  mvc:
    log-resolved-exception: false

  datasource:
    url: jdbc:postgresql://localhost:5432/meet_db
    username: postgres
    password: postgres
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: dev-only-jwt-signing-secret-not-for-production
  sms:
    provider: fake
  email:
    provider: fake
  otp:
    hash:
      current-key-id: dev-current
      current-key-base64: ZGV2LW9ubHktb3RwLWhtYWMta2V5LW1hdGVyaWFsLTMyaA==

logging:
  level:
    dev.whysoezzy: DEBUG
