spring:
  application:
    name: meet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/meet_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        enable_lazy_load_no_trans: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  admin:
    api-key: dev-secret

  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    cron: ${INGESTION_CRON:0 0 3 * * *}
    zone: ${INGESTION_ZONE:Europe/Moscow}

  jwt:
    secret: "meet-app-super-secret-key-change-in-production-min-32-chars"
    access-token-expiration-ms: 604800000   # 7 дней
    refresh-token-expiration-days: 30

  timepad:
    enabled: true
    base-url: https://api.timepad.ru/v1
    token: ${TIMEPAD_TOKEN:}
    category-ids:                # пусто = все; пример списком: [217, 452]
    keywords:                    # пример: [разработка, дизайн, data]
    cities:
    page-size: 100
    max-pages: 5
    days-ahead: 180
    zone: Europe/Moscow

  otp:
    expiration-minutes: 5
    max-attempts-per-hour: 5
    fake-sms: true

  storage:
    upload-dir: ./uploads
    base-url: http://localhost:8080/media
    max-file-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp

logging:
  level:
    root: INFO
    dev.whysoezzy: DEBUG
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
