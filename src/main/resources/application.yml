spring:
  application:
    name: meet-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        enable_lazy_load_no_trans: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  geocoder:
    enabled: true
    api-key: ${LOCATIONIQ_KEY:}
    base-url: https://eu1.locationiq.com/v1
    lang: ru

  admin:
    api-key: ${ADMIN_API_KEY:}

  ingestion:
    enabled: ${INGESTION_ENABLED:true}
    cron: ${INGESTION_CRON:0 0 3 * * *}
    zone: ${INGESTION_ZONE:Europe/Moscow}
    only-matching-topics: true

  jwt:
    secret: ${APP_JWT_SECRET:}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-days: 30

  timepad:
    enabled: true
    base-url: https://api.timepad.ru/v1
    token: ${TIMEPAD_TOKEN:}
    category-ids: [452]
    keywords:
    cities:
    page-size: 100
    max-pages: 5
    days-ahead: 180
    zone: Europe/Moscow

  otp:
    expiration-minutes: 5
    max-attempts-per-hour: 5
    rate-limit:
      window-minutes: 60
      ip-max-attempts: ${APP_OTP_IP_MAX_ATTEMPTS:20}
      device-enabled: ${APP_OTP_DEVICE_LIMIT_ENABLED:false}
      device-max-attempts: ${APP_OTP_DEVICE_MAX_ATTEMPTS:10}
      cleanup-batch-size: ${APP_OTP_RATE_LIMIT_CLEANUP_BATCH_SIZE:1000}

  sms:
    provider: ${APP_SMS_PROVIDER:disabled}

  storage:
    upload-dir: ./uploads
    base-url: http://localhost:8080/media
    max-file-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp

logging:
  level:
    root: INFO
    dev.whysoezzy: DEBUG
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
