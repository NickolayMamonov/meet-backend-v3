spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false

server:
  forward-headers-strategy: framework
  shutdown: graceful

app:
  demo-catalog:
    bootstrap-enabled: ${DEMO_CATALOG_BOOTSTRAP_ENABLED:false}
    allowed-media-hosts: ${DEMO_CATALOG_ALLOWED_MEDIA_HOSTS:}

  geocoder:
    enabled: ${GEOCODER_ENABLED:false}
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
  timepad:
    enabled: ${TIMEPAD_ENABLED:false}
  push:
    provider-enabled: ${APP_PUSH_PROVIDER_ENABLED:false}
    discovery-enabled: ${APP_PUSH_DISCOVERY_ENABLED:false}
    dispatch-enabled: ${APP_PUSH_DISPATCH_ENABLED:false}
    diagnostic-enabled: ${APP_PUSH_DIAGNOSTIC_ENABLED:false}
    maintenance-enabled: ${APP_PUSH_MAINTENANCE_ENABLED:false}
    project-id: ${APP_PUSH_PROJECT_ID:meeting-1d258}
    credentials-file: ${APP_PUSH_CREDENTIALS_FILE:}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:/data/uploads}
    base-url: ${APP_STORAGE_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
