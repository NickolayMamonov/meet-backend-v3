name: meet-production

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    image: postgres:16-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable release image}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_REVISION: ${BACKEND_REVISION:?BACKEND_REVISION must be the full source commit SHA}
    env_file:
      - .env.production
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_STORAGE_UPLOAD_DIR: /data/uploads
      APP_STORAGE_BASE_URL: ${APP_STORAGE_BASE_URL:?APP_STORAGE_BASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/data/uploads
    user: "10001:10001"
    tmpfs:
      - /tmp
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    restart: unless-stopped
    logging: *bounded-logging

volumes:
  postgres_data:
    name: meet-production_postgres_data
  uploads_data:
    name: meet-production_uploads_data
